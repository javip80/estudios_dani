
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repaso del islam - 2.º ESO</title>
<style>
:root {
  --azul: #087c83;
  --oscuro: #183740;
  --fondo: #f3f7f7;
  --verde: #176341;
  --rojo: #963047;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--fondo);
  color: var(--oscuro);
  font-family: system-ui, Arial, sans-serif;
  line-height: 1.5;
}
header {
  padding: 22px 15px;
  background: linear-gradient(110deg, #123f49, #087c83);
  text-align: center;
  color: white;
}
header h1 { margin: 0; font-size: 28px; }
header p { margin: 4px 0 0; font-size: 14px; }
main {
  max-width: 780px;
  margin: 22px auto;
  padding: 0 14px;
}
.panel {
  background: white;
  border: 1px solid #d6e4e2;
  border-radius: 16px;
  padding: 25px;
  box-shadow: 0 6px 22px #12485010;
}
[hidden] { display: none !important; }
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 14px;
}
.pill {
  background: #e7f3f2;
  border-radius: 20px;
  padding: 5px 12px;
  font-weight: bold;
  font-size: 13px;
}
.bar {
  background: #e2eeec;
  height: 9px;
  border-radius: 20px;
  margin: 15px 0 23px;
  overflow: hidden;
}
#progress {
  height: 100%;
  width: 0;
  background: var(--azul);
  transition: width .2s;
}
.question {
  font-size: 23px;
  font-weight: 800;
  margin: 15px 0 24px;
  line-height: 1.35;
}
.options {
  display: grid;
  gap: 11px;
}
.option {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  width: 100%;
  min-height: 55px;
  background: white;
  border: 2px solid #d7e5e3;
  border-radius: 11px;
  color: var(--oscuro);
  font: 600 16px system-ui, Arial;
  text-align: left;
  cursor: pointer;
}
.option:hover:not(:disabled) {
  background: #f0faf8;
  border-color: var(--azul);
}
.option:disabled { cursor: default; opacity: 1; }
.option.correct {
  background: #e7f6ed;
  border-color: #24955e;
  color: #125338;
}
.option.incorrect {
  background: #fcecee;
  border-color: #d06579;
  color: #85263a;
}
.letter {
  display: grid;
  place-items: center;
  flex: 0 0 30px;
  height: 30px;
  background: #e7f0ee;
  border-radius: 8px;
  font-size: 13px;
  font-weight: bold;
}
.feedback {
  margin-top: 17px;
  padding: 13px;
  border-radius: 10px;
  font-weight: bold;
}
.good { background: #e3f5ea; color: var(--verde); }
.bad { background: #fcebed; color: var(--rojo); }
.actions { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; }
.action {
  padding: 13px 18px;
  border: 0;
  border-radius: 10px;
  cursor: pointer;
  font: bold 16px system-ui, Arial;
}
.primary { background: var(--azul); color: white; }
.secondary { background: #e9f2f0; color: var(--oscuro); }
.result {
  font-size: 36px;
  font-weight: 850;
  margin: 12px 0;
}
.stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
.stats span {
  background: #edf5f3;
  padding: 10px;
  border-radius: 9px;
  font-weight: bold;
}
.error-card {
  border: 1px solid #d8e6e3;
  border-radius: 11px;
  padding: 15px;
  margin: 13px 0;
}
.error-card h3 { margin: 10px 0; }
.wrong { color: var(--rojo); }
.right { color: var(--verde); }
footer {
  text-align: center;
  color: #58757b;
  font-size: 13px;
  margin-top: 20px;
}
@media(max-width: 520px) {
  .panel { padding: 17px; }
  .question { font-size: 21px; }
  .actions .action { width: 100%; }
}
</style>
</head>
<body>

<header>
  <h1>El islam y su expansión</h1>
  <p>Geografía e Historia · 2.º ESO</p>
</header>

<main>
<section id="quiz" class="panel">
  <div class="top">
    <span id="section" class="pill"></span>
    <span id="counter"></span>
  </div>

  <div class="bar"><div id="progress"></div></div>

  <div id="question" class="question"></div>
  <div id="options" class="options"></div>
  <div id="feedback" class="feedback" hidden></div>

  <div class="actions">
    <button id="next" class="action primary" hidden>
      Siguiente pregunta
    </button>
  </div>
</section>

<section id="results" class="panel" hidden>
  <h2>Resultado del repaso</h2>
  <div id="score" class="result"></div>
  <p id="message"></p>
  <div id="stats" class="stats"></div>
  <div id="mistakes"></div>

  <div class="actions">
    <button id="retry" class="action primary" hidden>
      Repetir solo las falladas
    </button>
    <button id="restart" class="action secondary">
      Repetir el test completo
    </button>
  </div>
</section>

<footer>
  Basado en los ejercicios 1 al 7 de la hoja de repaso.
</footer>
</main>

<script>

/*

/* EJERCICIO 7 - COMPLETAR FRASES */

["7 · Completar frases",
"Completa: Las etapas del imperio musulmán fueron tres...",
"Califato ortodoxo, omeya y abasí",
"Califato omeya, abasí y ortodoxo",
"Califato abasí, omeya y ortodoxo",
"Califato omeya, romano y bizantino"],

["7 · Completar frases",
"En la primera etapa, a los sucesores de ... se los elegía entre sus familiares y amigos.",
"Mahoma",
"Los turcos",

["7 · Completar frases",
"En la segunda etapa, gobernó la dinastía de los...",
"Omeyas",
"Abasíes",
"Turcos",
"Ortodoxos"],

["7 · Completar frases",
"En la tercera etapa, gobernó la dinastía...",

"Omeya",
"Ortodoxa",
"Turca"]

];


/* FUNCIONES DEL TEST */

const $ = id => document.getElementById(id);

function shuffle(array) {
  const a = [...array];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let questions = [];
let position = 0;
let responses = [];
let locked = false;

function show(id) {
  $("quiz").hidden = id !== "quiz";
  $("results").hidden = id !== "results";
  window.scrollTo(0, 0);
}

function start(rows = BANK) {
  questions = shuffle(rows).map(r => ({
    section: r[0],
    text: r[1],
    correct: r[2],
    choices: shuffle(r.slice(2))
  }));
  position = 0;
  responses = [];
  show("quiz");
  render();
}

function render() {
  locked = false;
  const q = questions[position];

  $("section").textContent = q.section;
  $("counter").textContent =
    `Pregunta ${position + 1} de ${questions.length}`;

  $("progress").style.width =
    (position / questions.length * 100) + "%";

  $("question").textContent = q.text;
  $("feedback").hidden = true;
  $("next").hidden = true;
  $("options").replaceChildren();

  q.choices.forEach((value, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "option";

    const letter = document.createElement("span");
    letter.className = "letter";
    letter.textContent = "ABCD"[i];

    const text = document.createElement("span");
    text.textContent = value;

    btn.append(letter, text);
    btn.addEventListener("click", () => answer(value));

    $("options").append(btn);
  });
}

function answer(value) {
  if (locked) return;
  locked = true;

  const q = questions[position];
  const ok = value === q.correct;

  responses.push({
    q: q,
    selected: value,
    ok: ok
  });

  for (const button of $("options").children) {
    const option = button.lastElementChild.textContent;
    button.disabled = true;

    if (option === q.correct) {
      button.classList.add("correct");
    }
    if (option === value && !ok) {
      button.classList.add("incorrect");
    }
  }

  $("feedback").className =
    "feedback " + (ok ? "good" : "bad");

  $("feedback").textContent = ok
    ? "✓ ¡Correcto!"
    : "✗ Respuesta correcta: " + q.correct;

  $("feedback").hidden = false;

  $("progress").style.width =
    ((position + 1) / questions.length * 100) + "%";

  $("next").textContent =
    position === questions.length - 1
      ? "Ver resultado"
      : "Siguiente pregunta";

  $("next").hidden = false;
}

function finish() {
  show("results");

  const correct = responses.filter(r => r.ok).length;
  const wrong = responses.filter(r => !r.ok);
  const pct = Math.round(correct / responses.length * 100);

  const nota = (correct / responses.length * 10)
    .toFixed(1)
    .replace(".", ",");

  $("score").textContent =
    `${correct} / ${responses.length} · ${nota} / 10`;

  $("message").textContent =
    pct === 100
      ? "¡Enhorabuena! Todo correcto."
      : pct >= 80
      ? "Muy bien. Revisa los errores."
      : pct >= 60
      ? "Buen trabajo. Conviene repasar los fallos."
      : "Repasa la hoja y vuelve a intentarlo.";

  $("stats").replaceChildren();

  [
    `✓ Aciertos: ${correct}`,
    `✗ Errores: ${wrong.length}`,
    `Porcentaje: ${pct}%`
  ].forEach(text => {
    const span = document.createElement("span");
    span.textContent = text;
    $("stats").append(span);
  });

  $("mistakes").replaceChildren();

  if (wrong.length) {
    const h = document.createElement("h2");
    h.textContent = "Repaso de los errores";
    $("mistakes").append(h);

    wrong.forEach((r, i) => {
      const card = document.createElement("div");
      card.className = "error-card";

      const title = document.createElement("h3");
      title.textContent = `${i + 1}. ${r.q.text}`;

      const selected = document.createElement("p");
      selected.className = "wrong";
      selected.textContent =
        "Tu respuesta: " + r.selected;

      const right = document.createElement("p");
      right.className = "right";
      right.textContent =
        "Respuesta correcta: " + r.q.correct;

      card.append(title, selected, right);
      $("mistakes").append(card);
    });

  } else {
    const p = document.createElement("p");
    p.textContent = "No hay errores que repasar.";
    $("mistakes").append(p);
  }

  $("retry").hidden = wrong.length === 0;

  $("retry").onclick = () => {
    const failedRows = wrong.map(r => [
      r.q.section,
      r.q.text,
      r.q.correct,
      ...r.q.choices.filter(c => c !== r.q.correct)
    ]);

    start(failedRows);
  };
}

$("next").addEventListener("click", () => {
  if (!locked) return;

  if (position === questions.length - 1) {
    finish();
  } else {
    position++;
    render();
  }
});

$("restart").addEventListener("click", () => start());

// INICIO AUTOMÁTICO SIN MENÚ
start();

</script>
</body>
</html>
