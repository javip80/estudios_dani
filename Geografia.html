<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Test: Geografía - El tiempo y el clima</title>

<style>
*{ box-sizing:border-box; }
body{
    margin:0; padding:20px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:#e8f5e9; color:#333;
}
.container{
    max-width:900px; margin:auto;
    background:white; border-radius:16px;
    padding:30px; box-shadow:0 8px 24px rgba(0,0,0,0.1);
}
h1{ margin-top:0; color:#2e7d32; font-size: 1.8rem;}
.top-bar{
    display:flex; justify-content:space-between; align-items:center;
    gap:10px; flex-wrap:wrap; margin-bottom:20px;
}
.stats{ display:flex; gap:20px; font-weight:bold; font-size:1.1rem; }
.correct{ color:#27ae60; }
.wrong{ color:#c0392b; }
.progress-wrapper{
    width:100%; background:#c8e6c9; border-radius:999px;
    overflow:hidden; height:20px; margin:20px 0;
}
.progress-bar{
    height:100%; width:0%; background:#2e7d32; transition:0.4s ease-out;
}
.question{
    font-size:1.3rem; font-weight:bold; margin:25px 0; min-height:80px; line-height:1.4;
}
.options{
    display:grid; grid-template-columns:1fr 1fr; gap:15px;
}
button{
    border:none; border-radius:12px; padding:18px;
    cursor:pointer; font-size:1.1rem; transition:all 0.2s;
}
.option-btn{
    background:white; border:2px solid #2e7d32; color:#2e7d32;
    min-height:85px; font-weight:600; display:flex; flex-direction:column; justify-content:center; align-items:center;
    text-align: center;
}
.option-btn:hover:not(:disabled){
    background:#2e7d32; color:white; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(46, 125, 50, 0.2);
}
.option-btn:disabled{ cursor:default; transform:none; }
.correct-answer{
    background:#27ae60 !important; border-color:#27ae60 !important; color:white !important;
}
.wrong-answer{
    background:#c0392b !important; border-color:#c0392b !important; color:white !important;
}
.hint{
    display:block; margin-top:8px; font-size:0.9rem; opacity:0.95; font-style: italic; font-weight:normal;
}
.next-btn, .restart-btn, .review-btn{
    margin-top:30px; width:100%; background:#1b5e20;
    color:white; font-weight:bold; font-size:1.2rem;
}
.next-btn:hover, .restart-btn:hover, .review-btn:hover{ background:#003300; }
.hidden{ display:none; }
.result-title{ font-size:2.5rem; margin-bottom:10px; }
.success{ color:#27ae60; }
.fail{ color:#c0392b; }
.error-list{
    text-align:left; margin-top:20px; background:#f8f9fa;
    padding:20px; border-radius:12px; border-left: 5px solid #c0392b;
}
.error-list li{ margin-bottom:12px; font-size: 1.1rem; line-height: 1.4; }
.mode-badge{
    background:#2e7d32; color:white; padding:8px 16px;
    border-radius:999px; font-size:1rem; font-weight:bold; text-transform:uppercase; letter-spacing:1px;
}
@media(max-width:650px){
    .options{ grid-template-columns:1fr; }
    .question{ font-size:1.2rem; }
    .top-bar{ flex-direction:column; align-items:flex-start; }
}
</style>
</head>

<body>
<div class="container">
    <div id="quiz-screen">
        <div class="top-bar">
            <h1>🌍 Test: Geografía (El Tiempo y el Clima)</h1>
            <div class="mode-badge" id="mode-badge">TEST PRINCIPAL</div>
        </div>

        <div class="top-bar">
            <div>Pregunta <strong><span id="question-number">1</span> / <span id="question-total">40</span></strong></div>
            <div class="stats">
                <span class="correct">✅ <span id="correct-count">0</span></span>
                <span class="wrong">❌ <span id="wrong-count">0</span></span>
            </div>
        </div>

        <div class="progress-wrapper">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="question" id="question-text">Cargando...</div>
        <div class="options" id="options-container"></div>
        <button class="next-btn hidden" id="next-btn">Siguiente Pregunta →</button>
    </div>

    <div id="result-screen" class="hidden">
        <h2 class="result-title" id="result-title"></h2>
        <p style="font-size:1.5rem">Aciertos: <strong id="final-score"></strong></p>
        <p style="font-size:1.5rem">Porcentaje: <strong id="final-percentage"></strong></p>

        <div id="mistakes-section" class="hidden">
            <h3>Conceptos a repasar:</h3>
            <ul class="error-list" id="mistakes-list"></ul>
            <button class="review-btn" id="review-btn">Practicar Errores</button>
        </div>
        <button class="restart-btn" id="restart-btn">Generar Nuevo Test de 40 Preguntas</button>
    </div>
</div>

<script>
// =====================================
// BASE DE DATOS EXACTA DE LOS APUNTES (40 PREGUNTAS)
// =====================================
const questionPool = [
    // BLOQUE 1: Originales (30 preguntas)
    { q: "¿Qué es la atmósfera según tus apuntes?", correct: "Una capa gaseosa que envuelve la Tierra y hace que la vida sea posible.", options: ["Una capa gaseosa que envuelve la Tierra y hace que la vida sea posible.", "La capa sólida de la Tierra.", "Una capa de agua que rodea los continentes.", "El conjunto de seres vivos del planeta."], hint: "Está formada por gases." },
    { q: "¿Qué gases forman la atmósfera?", correct: "Oxígeno, nitrógeno y dióxido de carbono.", options: ["Oxígeno, nitrógeno y dióxido de carbono.", "Hierro, níquel y silicio.", "Helio, ozono y agua.", "Magnesio, calcio y oxígeno."], hint: "El primero es esencial para que respiremos." },
    { q: "¿Cuál es la capa más externa de la atmósfera que conecta con el espacio (de 500 a 10.000 Km)?", correct: "La exosfera.", options: ["La exosfera.", "La troposfera.", "La termosfera.", "La mesosfera."], hint: "Empieza por 'Exo'." },
    { q: "¿En qué capa de la atmósfera se instalan los satélites y las estaciones espaciales?", correct: "En la termosfera.", options: ["En la termosfera.", "En la estratosfera.", "En la troposfera.", "En la mesosfera."], hint: "Está entre los 80 y 500 km." },
    { q: "¿En qué capa se desintegran los asteroides cuando impactan?", correct: "En la mesosfera.", options: ["En la mesosfera.", "En la estratosfera.", "En la troposfera.", "En la exosfera."], hint: "Es la capa intermedia (50 a 80 km)." },
    { q: "¿En qué capa se encuentra la capa de ozono?", correct: "En la estratosfera.", options: ["En la estratosfera.", "En la troposfera.", "En la exosfera.", "En la termosfera."], hint: "Está entre 12 y 50 km de altura." },
    { q: "¿En qué capa se producen los fenómenos meteorológicos y vivimos nosotros?", correct: "En la troposfera.", options: ["En la troposfera.", "En la estratosfera.", "En la mesosfera.", "En la termosfera."], hint: "Es la que se inicia en el nivel del mar." },
    { q: "¿De qué nos protegen la atmósfera y la capa de ozono?", correct: "De los rayos ultravioleta.", options: ["De los rayos ultravioleta.", "De los terremotos.", "De las bajas temperaturas del núcleo.", "De la falta de lluvia."], hint: "Son rayos perjudiciales que provienen del Sol." },
    { q: "¿Qué es el 'tiempo'?", correct: "El estado de la atmósfera en un lugar concreto y en un periodo de tiempo corto (tres días).", options: ["El estado de la atmósfera en un lugar concreto y en un periodo de tiempo corto (tres días).", "El comportamiento de la atmósfera en un periodo largo (meses o años).", "La temperatura media de una estación entera.", "El nivel de lluvias a lo largo de un año."], hint: "Es muy específico y a corto plazo." },
    { q: "¿Qué ciencia estudia el clima?", correct: "La climatología.", options: ["La climatología.", "La meteorología.", "La sismología.", "La geología."], hint: "Su nombre deriva de la palabra clima." },
    { q: "En un climograma, ¿qué indican la línea roja y las barras azules?", correct: "La línea roja es la temperatura y las barras azules las precipitaciones.", options: ["La línea roja es la temperatura y las barras azules las precipitaciones.", "La roja son precipitaciones y las azules la temperatura.", "La roja es la humedad y las azules el viento.", "La roja es el clima y las azules el tiempo."], hint: "Rojo = calor, Azul = agua." },
    { q: "¿Qué zonas climáticas existen en la Tierra según la latitud?", correct: "Cálida, templada y fría.", options: ["Cálida, templada y fría.", "Ecuatorial, tropical y polar.", "Seca, lluviosa y mixta.", "Oceánica, continental y desértica."], hint: "Dependen de lo cerca o lejos que estés del ecuador." },
    { q: "¿Por qué hay mayor temperatura a menor altitud?", correct: "Porque el suelo hace de retenedor térmico.", options: ["Porque el suelo hace de retenedor térmico.", "Porque hay más oxígeno en el aire.", "Porque el viento sopla más despacio.", "Porque los rayos del sol impactan más fuerte."], hint: "El suelo absorbe y guarda el calor." },
    { q: "¿Por qué la cercanía al mar hace que la temperatura sea más suave?", correct: "Porque el agua hace de termostato.", options: ["Porque el agua hace de termostato.", "Porque el aire del mar es más frío.", "Porque las nubes tapan el sol en la costa.", "Porque hay menor presión atmosférica."], hint: "Regula los cambios bruscos de frío y calor." },
    { q: "¿Qué tres tipos de temperatura encontramos?", correct: "Absoluta (máxima y mínima), amplitud térmica y media.", options: ["Absoluta (máxima y mínima), amplitud térmica y media.", "Diurna, nocturna y semanal.", "Polar, templada y ecuatorial.", "Cálida, fría y congelada."], hint: "Una es la diferencia entre máximas y mínimas." },
    { q: "¿Qué instrumento mide la humedad?", correct: "El higrómetro.", options: ["El higrómetro.", "El pluviómetro.", "El barómetro.", "El anemómetro."], hint: "Mide el vapor de agua en la atmósfera." },
    { q: "¿En qué formas se manifiesta la precipitación?", correct: "Agua, aguanieve, nieve o granizo.", options: ["Agua, aguanieve, nieve o granizo.", "Lluvia, rocío, niebla o escarcha.", "Vapor, hielo o líquido.", "Brisa, tifón, huracán o vendaval."], hint: "Depende de su temperatura al caer." },
    { q: "¿Qué instrumento mide la cantidad de agua que cae (precipitación)?", correct: "El pluviómetro.", options: ["El pluviómetro.", "El barómetro.", "El termómetro.", "La veleta."], hint: "Pluvio viene del latín 'lluvia'." },
    { q: "¿Qué son los anticiclones o altas presiones?", correct: "Están por encima de 1013 milibares y repelen a las nubes.", options: ["Están por encima de 1013 milibares y repelen a las nubes.", "Están por debajo de 1013 milibares y atraen nubes.", "Miden la velocidad extrema del viento.", "Son tormentas que se forman en el mar."], hint: "Al no haber nubes, suele hacer buen tiempo." },
    { q: "¿Qué son las borrascas o bajas presiones?", correct: "Están por debajo de 1013 milibares y atraen a las nubes.", options: ["Están por debajo de 1013 milibares y atraen a las nubes.", "Están por encima de 1013 milibares y repelen nubes.", "Son vientos locales muy suaves.", "Son zonas sin ningún tipo de precipitación."], hint: "Por eso cuando hay una, suele llover." },
    { q: "¿Con qué instrumentos se mide la velocidad y dirección del viento?", correct: "Anemómetro (velocidad) y veleta (dirección).", options: ["Anemómetro (velocidad) y veleta (dirección).", "Barómetro (velocidad) y pluviómetro (dirección).", "Higrómetro (velocidad) y sismógrafo (dirección).", "Termómetro (velocidad) y veleta (dirección)."], hint: "Uno gira con cazoletas y el otro apunta al norte/sur." },
    { q: "¿Cuáles son los tres tipos de viento?", correct: "Planetarios, estacionales y locales.", options: ["Planetarios, estacionales y locales.", "Fuertes, suaves y huracanados.", "Norte, sur y este.", "Cálidos, fríos y templados."], hint: "Uno abarca la Tierra, otro épocas del año, y otro puntos concretos." },
    { q: "¿Qué elementos principales sigue el sistema de Köppen para establecer conjuntos bioclimáticos?", correct: "La temperatura y las precipitaciones.", options: ["La temperatura y las precipitaciones.", "La presión atmosférica y el viento.", "La humedad y la altitud.", "La distancia al mar y la flora."], hint: "Lo mismo que se grafica en un climograma." },
    { q: "¿Qué característica tienen los bioclimas forestales?", correct: "Por sus condiciones tienen un gran nivel de vegetación y biodiversidad.", options: ["Por sus condiciones tienen un gran nivel de vegetación y biodiversidad.", "No tienen vegetación por exceso de calor o frío.", "No se pueden localizar en un punto concreto.", "Solo tienen árboles de hoja caduca."], hint: "Son zonas verdes llenas de vida." },
    { q: "¿Qué son los bioclimas no zonales?", correct: "Aquellos que no podemos localizar en un punto concreto de la Tierra (clima montañoso).", options: ["Aquellos que no podemos localizar en un punto concreto de la Tierra (clima montañoso).", "Aquellos que no tienen vegetación.", "Los que tienen exceso de frío.", "Los que están cerca del ecuador."], hint: "Aparecen donde hay montañas, sea el país que sea." },
    { q: "¿Cuáles son las tres variantes del bioclima forestal cálido?", correct: "Ecuatorial, de sabana y monzónico.", options: ["Ecuatorial, de sabana y monzónico.", "Chino, mediterráneo y oceánico.", "Continental, desértico y polar.", "Jungla, sabana y bosque perenne."], hint: "Típico de países como Brasil o Tailandia." },
    { q: "En el bioclima forestal templado, ¿cuándo se concentran las precipitaciones?", correct: "En otoño y primavera.", options: ["En otoño y primavera.", "En invierno y verano.", "Solo en invierno.", "Repartidas por todo el año por igual."], hint: "El verano y el invierno son las estaciones secas." },
    { q: "Nombra animales típicos del bioclima forestal templado según tus apuntes.", correct: "Ciervos, jabalíes, osos y linces.", options: ["Ciervos, jabalíes, osos y linces.", "Leones, tigres, monos y cebras.", "Lobos y búhos.", "Elefantes y gacelas."], hint: "Son los animales que encontrarías en España." },
    { q: "¿Cuáles son las tres variantes del bioclima forestal templado?", correct: "Chino, mediterráneo y oceánico.", options: ["Chino, mediterráneo y oceánico.", "Ecuatorial, sabana y monzónico.", "Continental, montañoso y polar.", "Perenne, caduco y mixto."], hint: "Dos de ellos se dan en la Península Ibérica." },
    { q: "¿Cuál es la única variante del bioclima forestal frío?", correct: "El clima continental.", options: ["El clima continental.", "El clima mediterráneo.", "El clima polar.", "El clima oceánico."], hint: "Típico de países como Rusia, Canadá o Noruega." },

    // BLOQUE 2: 10 Nuevas preguntas de los apuntes
    { q: "¿En qué capa de la atmósfera encontramos la mayor concentración de oxígeno que nos permite vivir?", correct: "En la troposfera.", options: ["En la troposfera.", "En la estratosfera.", "En la mesosfera.", "En la exosfera."], hint: "Es la capa más cercana a la superficie terrestre." },
    { q: "Según tus apuntes, ¿qué actividades del ser humano determinan el tiempo y el clima?", correct: "Nuestro ocio, las labores agrícolas y el turismo.", options: ["Nuestro ocio, las labores agrícolas y el turismo.", "La minería y la pesca.", "La construcción de edificios.", "El uso de satélites espaciales."], hint: "Dependen de si hace buen o mal tiempo." },
    { q: "En un climograma, ¿dónde se colocan los meses del año?", correct: "En la parte inferior.", options: ["En la parte inferior.", "En la parte superior.", "En el eje vertical izquierdo.", "Junto a la línea roja de temperatura."], hint: "Se ponen en la base del gráfico." },
    { q: "¿Qué significa la 'temperatura absoluta' en tus apuntes?", correct: "La temperatura máxima y mínima.", options: ["La temperatura máxima y mínima.", "La temperatura media mensual.", "La amplitud térmica de un día.", "La temperatura a nivel del mar."], hint: "Son los picos más altos y más bajos." },
    { q: "¿Cómo se llaman los vientos que abarcan grandes extensiones de la Tierra?", correct: "Vientos planetarios.", options: ["Vientos planetarios.", "Vientos estacionales.", "Vientos locales.", "Vientos continentales."], hint: "Su nombre alude a que afectan a casi todo el globo." },
    { q: "¿Por qué los bioclimas no forestales carecen de vegetación?", correct: "Por exceso de calor o de frío.", options: ["Por exceso de calor o de frío.", "Por falta de oxígeno.", "Porque están bajo el nivel del mar.", "Porque la presión atmosférica es baja."], hint: "Son zonas de extremos muy duros para las plantas." },
    { q: "¿Qué tipo de vegetación es propia del bioclima forestal frío?", correct: "Praderas y bosques de coníferas como el pino.", options: ["Praderas y bosques de coníferas como el pino.", "Árboles de hoja caduca y perenne.", "Selva, jungla y pequeños arbustos.", "Solo musgos y líquenes."], hint: "Son árboles que aguantan bien la nieve." },
    { q: "Nombra los países que aparecen en tus apuntes como ejemplo de bioclima forestal cálido.", correct: "Tailandia, Brasil, Congo, Venezuela y Tanzania.", options: ["Tailandia, Brasil, Congo, Venezuela y Tanzania.", "España, Francia, Portugal y China.", "Canadá, Noruega, Rusia y Reino Unido.", "Ninguno de los anteriores."], hint: "Son países muy famosos por sus selvas y sabanas." },
    { q: "Nombra los países que aparecen en tus apuntes como ejemplo de bioclima forestal frío.", correct: "Canadá, Noruega, Rusia y Reino Unido.", options: ["Canadá, Noruega, Rusia y Reino Unido.", "Tailandia, Brasil, Congo y Venezuela.", "España, Francia, Portugal y China.", "Australia, Egipto y México."], hint: "Son países situados muy al norte del globo." },
    { q: "¿A partir de qué altitud se inicia y dónde acaba la troposfera?", correct: "Se inicia en el nivel del mar (0 Km) hasta los 12 Km.", options: ["Se inicia en el nivel del mar (0 Km) hasta los 12 Km.", "De los 12 a los 50 Km.", "De los 50 a los 80 Km.", "De los 80 a los 500 Km."], hint: "Es la capa más pequeña en grosor." }
];

// =====================================
// ESTADOS Y VARIABLES
// =====================================
let currentQuestions = [];
let currentIndex = 0;
let correctAnswers = 0;
let wrongAnswers = 0;
let mistakes = [];
let reviewMode = false;
const QUESTIONS_PER_TEST = 40;

// Elementos DOM
const questionText = document.getElementById("question-text");
const optionsContainer = document.getElementById("options-container");
const nextBtn = document.getElementById("next-btn");
const correctCount = document.getElementById("correct-count");
const wrongCount = document.getElementById("wrong-count");
const questionNumber = document.getElementById("question-number");
const questionTotal = document.getElementById("question-total");
const progressBar = document.getElementById("progress-bar");
const quizScreen = document.getElementById("quiz-screen");
const resultScreen = document.getElementById("result-screen");
const resultTitle = document.getElementById("result-title");
const finalScore = document.getElementById("final-score");
const finalPercentage = document.getElementById("final-percentage");
const mistakesSection = document.getElementById("mistakes-section");
const mistakesList = document.getElementById("mistakes-list");
const reviewBtn = document.getElementById("review-btn");
const restartBtn = document.getElementById("restart-btn");
const modeBadge = document.getElementById("mode-badge");

// =====================================
// UTILIDADES
// =====================================
function shuffle(array){
    const arr = [...array];
    for(let i = arr.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// =====================================
// LÓGICA DEL TEST
// =====================================
function startMainTest(){
    currentIndex = 0; correctAnswers = 0; wrongAnswers = 0; mistakes = [];
    currentQuestions = shuffle(questionPool).slice(0, QUESTIONS_PER_TEST);
    reviewMode = false;
    
    questionTotal.textContent = currentQuestions.length;
    showQuizScreen();
    renderQuestion();
}

function startReviewMode(){
    currentIndex = 0; correctAnswers = 0; wrongAnswers = 0;
    currentQuestions = shuffle(mistakes);
    reviewMode = true;
    
    questionTotal.textContent = currentQuestions.length;
    showQuizScreen();
    renderQuestion();
}

function renderQuestion(){
    nextBtn.classList.add("hidden");
    updateStats();

    const item = currentQuestions[currentIndex];
    questionText.textContent = item.q;
    questionNumber.textContent = currentIndex + 1;
    progressBar.style.width = `${((currentIndex) / currentQuestions.length) * 100}%`;

    const shuffledOptions = shuffle(item.options);
    optionsContainer.innerHTML = "";

    shuffledOptions.forEach(option => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `<span>${option}</span>`;

        btn.addEventListener("click", () => {
            const buttons = document.querySelectorAll(".option-btn");
            buttons.forEach(b => {
                b.disabled = true;
                if(b.textContent === item.correct){
                    b.classList.add("correct-answer");
                }
            });

            if(option === item.correct){
                correctAnswers++;
            } else {
                wrongAnswers++;
                btn.classList.add("wrong-answer");

                const hintSpan = document.createElement("span");
                hintSpan.className = "hint";
                hintSpan.innerHTML = `💡 <strong>Pista:</strong> ${item.hint}`;
                
                buttons.forEach(b => {
                    if(b.textContent === item.correct){
                        b.appendChild(hintSpan);
                    }
                });

                if(!mistakes.includes(item)){
                    mistakes.push(item);
                }
            }
            updateStats();
            nextBtn.classList.remove("hidden");
        });
        optionsContainer.appendChild(btn);
    });
}

function nextQuestion(){
    currentIndex++;
    if(currentIndex < currentQuestions.length){
        renderQuestion();
    } else {
        showResults();
    }
}

function showResults(){
    quizScreen.classList.add("hidden");
    resultScreen.classList.remove("hidden");

    const total = currentQuestions.length;
    const percentage = Math.round((correctAnswers / total) * 100);

    finalScore.textContent = `${correctAnswers} / ${total}`;
    finalPercentage.textContent = `${percentage}%`;

    if(percentage >= 85){
        resultTitle.textContent = "🏆 ¡Impresionante, Dani!";
        resultTitle.className = "result-title success";
    } else {
        resultTitle.textContent = "❌ ¡No te rindas, repasa tus fallos!";
        resultTitle.className = "result-title fail";
    }

    if(mistakes.length > 0 && !reviewMode){
        mistakesSection.classList.remove("hidden");
        mistakesList.innerHTML = "";
        mistakes.forEach(questionObj => {
            const li = document.createElement("li");
            li.innerHTML = `<strong>${questionObj.q}</strong><br>Respuesta correcta: <span class="correct">${questionObj.correct}</span>`;
            mistakesList.appendChild(li);
        });
    } else {
        mistakesSection.classList.add("hidden");
    }
}

function updateStats(){
    correctCount.textContent = correctAnswers;
    wrongCount.textContent = wrongAnswers;
    modeBadge.textContent = reviewMode ? "MODO REPASO DE ERRORES" : `TEST PRINCIPAL (${QUESTIONS_PER_TEST} PREGUNTAS)`;
}

function showQuizScreen(){
    resultScreen.classList.add("hidden");
    quizScreen.classList.remove("hidden");
}

nextBtn.addEventListener("click", nextQuestion);
restartBtn.addEventListener("click", startMainTest);
reviewBtn.addEventListener("click", startReviewMode);

startMainTest();
</script>
</body>
</html>
