<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dani: Reto de Geografía (La Hidrosfera)</title>
<style>
body { font-family: 'Segoe UI', sans-serif; background-color: #f0f8ff; text-align: center; padding: 20px; margin: 0; }
.container { max-width: 650px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
h1 { color: #2980b9; }
.score-board { font-size: 1.2em; font-weight: bold; color: #2980b9; margin-bottom: 10px; }
.live-stats { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; font-weight: bold; background: #eaf2f8; padding: 10px; border-radius: 8px; border: 1px solid #d4e6f1; }
.stat-correct { color: #27ae60; } .stat-wrong { color: #c0392b; }
.question { font-size: 1.4em; margin-bottom: 30px; font-weight: bold; color: #2c3e50; min-height: 60px; line-height: 1.4; }
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
@media (max-width: 500px) { .options { grid-template-columns: 1fr; } }
button { padding: 15px; font-size: 1.1em; border: 2px solid #2980b9; background: white; color: #2980b9; border-radius: 8px; cursor: pointer; transition: 0.3s; min-height: 65px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
button:hover:not(:disabled) { background: #2980b9; color: white; }
.btn-correct { background: #27ae60 !important; color: white !important; border-color: #27ae60 !important; }
.btn-wrong { background: #c0392b !important; color: white !important; border-color: #c0392b !important; }
.meaning-hint { font-size: 0.85em; margin-top: 8px; font-style: italic; color: #ffdada; opacity: 0.9; }
#btn-siguiente { display: none; margin-top: 30px; background: #2c3e50; color: white; border: none; width: 100%; font-weight: bold; font-size: 1.2em; padding: 15px; border-radius: 8px; cursor: pointer; }
#btn-siguiente:hover { background: #1a252f; }
#pantalla-resultado { display: none; }
.success { color: #27ae60; } .fail { color: #c0392b; }
.btn-repetir { margin-top: 20px; background: #2980b9; color: white; width: 100%; padding: 15px; font-size: 1.1em; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;}
.btn-repetir:hover { background: #1f618d; }
</style>
</head>
<body>
<div class="container" id="pantalla-quiz">
<h1>🌊 Teoría de Geografía</h1>
<div class="score-board">Pregunta <span id="num-pregunta">1</span> de 20</div>
<div class="live-stats">
<span class="stat-correct">✅ Correctas: <span id="contador-correctas">0</span></span>
<span class="stat-wrong">❌ Incorrectas: <span id="contador-incorrectas">0</span></span>
</div>
<div class="question" id="texto-pregunta">Cargando...</div>
<div class="options" id="contenedor-opciones"></div>
<button id="btn-siguiente" onclick="pasarPregunta()">Siguiente Pregunta ➔</button>
</div>

<div class="container" id="pantalla-resultado">
<h1 id="titulo-resultado">¡Test Terminado!</h1>
<p>Has acertado <strong id="aciertos">0</strong> de 20 preguntas.</p>
<p>Porcentaje: <strong id="porcentaje">0%</strong> (Mínimo para aprobar: 85%)</p>
<h2 id="mensaje-resultado"></h2>
<button class="btn-repetir" onclick="iniciarTest()">Repetir Test</button>
</div>

<script>
// ==========================================
// 15 PREGUNTAS DE HIDROSFERA + 5 DEL RESTO
// ==========================================
const miLista = [
// --- SECCIÓN: LA HIDROSFERA (15 Preguntas) ---
{ q: "¿Cómo llamamos a la parte de la Tierra que está formada por agua? ( 🌊 )", a: "Hidrosfera" },
{ q: "¿Qué tipo de agua tiene una mayor presencia en la hidrosfera, ocupando el 96,5%? ( 🧂 )", a: "Agua salada" },
{ q: "¿Qué porcentaje de todo el agua de la Tierra corresponde al agua dulce? ( 💧 )", a: "3,5%" },
{ q: "¿En qué estado se encuentra el agua de un glaciar o del hielo? ( 🧊 )", a: "Sólido" },
{ q: "¿En qué estado se encuentra el agua de los mares, océanos y ríos? ( 🚰 )", a: "Líquido" },
{ q: "¿En qué estado se encuentra el agua que forma las nubes en el cielo? ( ☁️ )", a: "Gaseoso" },
{ q: "¿Qué característica tiene el ciclo del agua al no tener principio ni fin? ( 🔄 )", a: "Es circular" },
{ q: "¿Qué fase del ciclo del agua transforma el líquido en gaseoso debido al calor del sol? ( ☀️ )", a: "Evaporación" },
{ q: "¿Cómo se llama el proceso donde el vapor de agua se concentra y forma nubes? ( 🌫️ )", a: "Condensación" },
{ q: "¿Qué nombre recibe la caída del agua desde las nubes en forma de lluvia, nieve o granizo? ( 🌧️ )", a: "Precipitación" },
{ q: "¿De qué depende que la precipitación caiga en forma de lluvia, nieve o granizo? ( 🌡️ )", a: "De la temperatura" },
{ q: "¿Cómo se llama el proceso por el cual el agua cae y penetra bajo la tierra? ( 🕳️ )", a: "Infiltración" },
{ q: "¿Qué proceso ocurre cuando el agua fluye por la superficie formando ríos o desembocando en el mar? ( 🏞️ )", a: "Escorrentía" },
{ q: "Según los apuntes, ¿se considera que el agua de la Tierra es infinita? ( ♻️ )", a: "No, porque se va reutilizando" },
{ q: "¿A dónde suele llegar el agua tras el proceso de infiltración bajo la tierra? ( 🪨 )", a: "A un acuífero" },

// --- SECCIÓN: OCÉANOS, MARES Y RÍOS (5 Preguntas) ---
{ q: "¿Cuáles son las masas de agua más grandes del planeta de las cuales hay cinco? ( 🌎 )", a: "Océanos" },
{ q: "¿Qué nombre reciben las ondas en el agua producidas por el viento cuando agita el mar? ( 🌊 )", a: "Olas" },
{ q: "¿Cómo llamamos a los cambios periódicos del nivel del agua provocados por la Luna y el Sol? ( 🌔 )", a: "Mareas" },
{ q: "¿En qué parte de un río se produce su nacimiento, generalmente en una montaña? ( ⛰️ )", a: "Curso alto" },
{ q: "¿Cómo se llama la estructura por la que fluye el agua en el curso medio de un río? ( 📏 )", a: "Caudal" }
];

let poolPreguntas = [];
let indicePregunta = 0;
let aciertos = 0;
let errores = 0;
const TOTAL_PREGUNTAS = 20;

function shuffle(array) {
return array.sort(() => Math.random() - 0.5);
}

function actualizarStats() {
document.getElementById("contador-correctas").innerText = aciertos;
document.getElementById("contador-incorrectas").innerText = errores;
}

function iniciarTest() {
document.getElementById("pantalla-resultado").style.display = "none";
document.getElementById("pantalla-quiz").style.display = "block";

aciertos = 0;
errores = 0;
indicePregunta = 0;
actualizarStats();

poolPreguntas = shuffle([...miLista]);
mostrarPregunta();
}

function mostrarPregunta() {
document.getElementById("btn-siguiente").style.display = "none";
document.getElementById("num-pregunta").innerText = indicePregunta + 1;

let pActual = poolPreguntas[indicePregunta];
document.getElementById("texto-pregunta").innerText = pActual.q;

// Coger las opciones falsas de forma aleatoria
let respuestasFalsas = miLista.filter(i => i.a !== pActual.a).map(i => i.a);
let falsasUnicas = shuffle([...new Set(respuestasFalsas)]).slice(0, 5);

let opciones = shuffle([pActual.a, ...falsasUnicas]);

let contenedor = document.getElementById("contenedor-opciones");
contenedor.innerHTML = "";

opciones.forEach(opcion => {
let btn = document.createElement("button");
btn.innerText = opcion;
btn.onclick = () => comprobarRespuesta(btn, opcion, pActual.a);
contenedor.appendChild(btn);
});
}

function comprobarRespuesta(botonSelecionado, respuestaElegida, respuestaCorrecta) {
let botones = document.getElementById("contenedor-opciones").getElementsByTagName("button");

Array.from(botones).forEach(btn => {
btn.disabled = true;
if(btn.innerText === respuestaCorrecta) btn.classList.add("btn-correct");
});

if (respuestaElegida === respuestaCorrecta) {
aciertos++;
} else {
botonSelecionado.classList.add("btn-wrong");
errores++;

// Lógica para mostrarle por qué se ha equivocado
let itemReal = miLista.find(i => i.a === respuestaElegida);
if(itemReal) {
// Al fallar le dice a qué concepto correspondía realmente el botón que ha tocado
botonSelecionado.innerHTML = `<span>${respuestaElegida}</span><span class="meaning-hint">Eso era: ${itemReal.q.split('(')[0].trim()}</span>`;
}
}

actualizarStats();
document.getElementById("btn-siguiente").style.display = "block";
}

function pasarPregunta() {
indicePregunta++;
if(indicePregunta < TOTAL_PREGUNTAS) {
mostrarPregunta();
} else {
mostrarResultados();
}
}

function mostrarResultados() {
document.getElementById("pantalla-quiz").style.display = "none";
document.getElementById("pantalla-resultado").style.display = "block";

let porcentaje = Math.round((aciertos / TOTAL_PREGUNTAS) * 100);
document.getElementById("aciertos").innerText = aciertos;
document.getElementById("porcentaje").innerText = porcentaje + "%";

let titulo = document.getElementById("titulo-resultado");
let mensaje = document.getElementById("mensaje-resultado");

if(porcentaje >= 85) {
titulo.innerText = "🏆 ¡Experto en Geografía! 🏆";
titulo.className = "success";
mensaje.innerText = "¡Enhorabuena! Dominas por completo la teoría del agua en la Tierra.";
} else {
titulo.innerText = "❌ Sigue practicando";
titulo.className = "fail";
mensaje.innerText = "Necesitas al menos un 85% para aprobar. ¡Fíjate en los errores y repite el reto!";
}
}

iniciarTest();
</script>
</body>
</html>
