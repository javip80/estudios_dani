<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Test: Geografía - El tiempo y el clima</title>

<style>
*{ box-sizing:border-box; }
body{
    margin:0; padding:20px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:#e8f5e9; color:#333;
}
.container{
    max-width:900px; margin:auto;
    background:white; border-radius:16px;
    padding:30px; box-shadow:0 8px 24px rgba(0,0,0,0.1);
}
h1{ margin-top:0; color:#2e7d32; font-size: 1.8rem;}
.top-bar{
    display:flex; justify-content:space-between; align-items:center;
    gap:10px; flex-wrap:wrap; margin-bottom:20px;
}
.stats{ display:flex; gap:20px; font-weight:bold; font-size:1.1rem; }
.correct{ color:#27ae60; }
.wrong{ color:#c0392b; }
.progress-wrapper{
    width:100%; background:#c8e6c9; border-radius:999px;
    overflow:hidden; height:20px; margin:20px 0;
}
.progress-bar{
    height:100%; width:0%; background:#2e7d32; transition:0.4s ease-out;
}
.question{
    font-size:1.3rem; font-weight:bold; margin:25px 0; min-height:80px; line-height:1.4;
}
.options{
    display:grid; grid-template-columns:1fr 1fr; gap:15px;
}
button{
    border:none; border-radius:12px; padding:18px;
    cursor:pointer; font-size:1.1rem; transition:all 0.2s;
}
.option-btn{
    background:white; border:2px solid #2e7d32; color:#2e7d32;
    min-height:85px; font-weight:600; display:flex; flex-direction:column; justify-content:center; align-items:center;
    text-align: center;
}
.option-btn:hover:not(:disabled){
    background:#2e7d32; color:white; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(46, 125, 50, 0.2);
}
.option-btn:disabled{ cursor:default; transform:none; }
.correct-answer{
    background:#27ae60 !important; border-color:#27ae60 !important; color:white !important;
}
.wrong-answer{
    background:#c0392b !important; border-color:#c0392b !important; color:white !important;
}
.hint{
    display:block; margin-top:8px; font-size:0.9rem; opacity:0.95; font-style: italic; font-weight:normal;
}
.next-btn, .restart-btn, .review-btn{
    margin-top:30px; width:100%; background:#1b5e20;
    color:white; font-weight:bold; font-size:1.2rem;
}
.next-btn:hover, .restart-btn:hover, .review-btn:hover{ background:#003300; }
.hidden{ display:none; }
.result-title{ font-size:2.5rem; margin-bottom:10px; }
.success{ color:#27ae60; }
.fail{ color:#c0392b; }
.error-list{
    text-align:left; margin-top:20px; background:#f8f9fa;
    padding:20px; border-radius:12px; border-left: 5px solid #c0392b;
}
.error-list li{ margin-bottom:12px; font-size: 1.1rem; line-height: 1.4; }
.mode-badge{
    background:#2e7d32; color:white; padding:8px 16px;
    border-radius:999px; font-size:1rem; font-weight:bold; text-transform:uppercase; letter-spacing:1px;
}
@media(max-width:650px){
    .options{ grid-template-columns:1fr; }
    .question{ font-size:1.2rem; }
    .top-bar{ flex-direction:column; align-items:flex-start; }
}
</style>
</head>

<body>
<div class="container">
    <div id="quiz-screen">
        <div class="top-bar">
            <h1>🌍 Test: Geografía (El Tiempo y el Clima)</h1>
            <div class="mode-badge" id="mode-badge">TEST PRINCIPAL</div>
        </div>

        <div class="top-bar">
            <div>Pregunta <strong><span id="question-number">1</span> / <span id="question-total">30</span></strong></div>
            <div class="stats">
                <span class="correct">✅ <span id="correct-count">0</span></span>
                <span class="wrong">❌ <span id="wrong-count">0</span></span>
            </div>
        </div>

        <div class="progress-wrapper">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="question" id="question-text">Cargando...</div>
        <div class="options" id="options-container"></div>
        <button class="next-btn hidden" id="next-btn">Siguiente Pregunta →</button>
    </div>

    <div id="result-screen" class="hidden">
        <h2 class="result-title" id="result-title"></h2>
        <p style="font-size:1.5rem">Aciertos: <strong id="final-score"></strong></p>
        <p style="font-size:1.5rem">Porcentaje: <strong id="final-percentage"></strong></p>

        <div id="mistakes-section" class="hidden">
            <h3>Conceptos a repasar:</h3>
            <ul class="error-list" id="mistakes-list"></ul>
            <button class="review-btn" id="review-btn">Practicar Errores</button>
        </div>
        <button class="restart-btn" id="restart-btn">Generar Nuevo Test de 30 Preguntas</button>
    </div>
</div>

<script>
// =====================================
// BASE DE DATOS: 40 PREGUNTAS (Tema 9)
// =====================================
const questionPool = [
    // La atmósfera y sus capas
    { q: "¿Qué es la atmósfera?", correct: "Una capa gaseosa que envuelve la Tierra y hace que la vida sea posible.", options: ["Una capa gaseosa que envuelve la Tierra y hace que la vida sea posible.", "La parte sólida de la Tierra.", "El conjunto de todos los océanos.", "La capa de rocas magmáticas."], hint: "Es lo que nos permite respirar." },
    { q: "¿Cuáles son algunos de los gases principales que forman la atmósfera?", correct: "Oxígeno, nitrógeno y dióxido de carbono.", options: ["Oxígeno, nitrógeno y dióxido de carbono.", "Hierro, níquel y silicio.", "Helio, oro y plata.", "Hidrógeno, magnesio y calcio."], hint: "Uno lo respiramos, el otro lo expulsan los coches." },
    { q: "¿Cuál es la capa más externa de la atmósfera que conecta con el espacio (de 500 a 10.000 Km)?", correct: "La exosfera.", options: ["La exosfera.", "La troposfera.", "La termosfera.", "La mesosfera."], hint: "Su nombre empieza por 'Exo', que significa fuera." },
    { q: "¿En qué capa de la atmósfera se instalan los satélites y las estaciones espaciales?", correct: "En la termosfera.", options: ["En la termosfera.", "En la estratosfera.", "En la troposfera.", "En la exosfera."], hint: "Es la segunda capa empezando por arriba (de 80 a 500 km)." },
    { q: "¿En qué capa se desintegran los asteroides cuando impactan en la atmósfera?", correct: "En la mesosfera.", options: ["En la mesosfera.", "En la estratosfera.", "En la exosfera.", "En la litosfera."], hint: "Es la capa del medio (meso = medio)." },
    { q: "¿En qué capa de la atmósfera se encuentra la capa de ozono?", correct: "En la estratosfera.", options: ["En la estratosfera.", "En la troposfera.", "En la exosfera.", "En la termosfera."], hint: "Empieza por 'Estra'." },
    { q: "¿En qué capa se producen los fenómenos meteorológicos y vivimos los seres humanos?", correct: "En la troposfera.", options: ["En la troposfera.", "En la estratosfera.", "En la exosfera.", "En la mesosfera."], hint: "Es la capa que toca el suelo y llega hasta los 12 Km." },
    { q: "¿De qué nos protegen la atmósfera y la capa de ozono?", correct: "De los rayos ultravioleta.", options: ["De los rayos ultravioleta.", "De los terremotos.", "De las erupciones volcánicas.", "De las bajas presiones atmosféricas."], hint: "Es la radiación peligrosa del Sol." },

    // Tiempo y Clima
    { q: "¿Qué es el 'tiempo' atmosférico?", correct: "El estado de la atmósfera en un lugar concreto y en un periodo de tiempo corto.", options: ["El estado de la atmósfera en un lugar concreto y en un periodo de tiempo corto.", "El comportamiento de la atmósfera en meses o años.", "El estudio de los mapas antiguos.", "La cantidad de agua en los océanos."], hint: "Es lo que miras en el móvil para saber si va a llover mañana." },
    { q: "¿Qué ciencia estudia el tiempo atmosférico?", correct: "La meteorología.", options: ["La meteorología.", "La climatología.", "La geología.", "La biología."], hint: "El que da el tiempo en la tele es el..." },
    { q: "¿Qué es el 'clima'?", correct: "El comportamiento de la atmósfera en un espacio extenso y en un periodo largo (meses o años).", options: ["El comportamiento de la atmósfera en un espacio extenso y en un periodo largo (meses o años).", "El estado de la atmósfera en un día concreto.", "La capa más baja de la atmósfera.", "La presión del viento en un momento dado."], hint: "Por ejemplo, decir que en España los veranos son calurosos." },
    { q: "¿Qué ciencia estudia el clima?", correct: "La climatología.", options: ["La climatología.", "La meteorología.", "La sismología.", "La astronomía."], hint: "Su propio nombre contiene la palabra a estudiar." },
    { q: "¿Qué herramienta nos enseña el estado de la atmósfera en un periodo corto y sale en televisión?", correct: "El mapa del tiempo.", options: ["El mapa del tiempo.", "El climograma.", "El sismógrafo.", "El pluviómetro."], hint: "Tiene dibujos de soles, nubes y frentes de colores." },
    { q: "¿Qué es un climograma?", correct: "Una representación gráfica de los climas para entender su comportamiento en un año.", options: ["Una representación gráfica de los climas para entender su comportamiento en un año.", "Un mapa de los satélites en el espacio.", "Un termómetro especial para medir huracanes.", "Una foto de las borrascas desde el espacio."], hint: "Es un gráfico con barras y líneas." },
    { q: "En un climograma, ¿qué representan las barras azules?", correct: "Las precipitaciones (lluvias).", options: ["Las precipitaciones (lluvias).", "Las temperaturas.", "La presión atmosférica.", "Los vientos."], hint: "El azul es el color del agua." },
    { q: "En un climograma, ¿qué representa la línea roja?", correct: "La temperatura.", options: ["La temperatura.", "Las precipitaciones.", "Los meses del año.", "La humedad relativa."], hint: "El rojo indica calor." },

    // Factores climáticos
    { q: "¿Qué son los factores climáticos?", correct: "Son los elementos que influyen y modifican el clima (latitud, altitud, cercanía al mar).", options: ["Son los elementos que influyen y modifican el clima (latitud, altitud, cercanía al mar).", "Son los instrumentos para medir la lluvia.", "Son los meses más lluviosos del año.", "Son las tres capas de la Tierra."], hint: "Hacen que el clima cambie según dónde estés." },
    { q: "¿Qué es la latitud como factor climático?", correct: "La distancia de un punto de la Tierra con respecto al ecuador.", options: ["La distancia de un punto de la Tierra con respecto al ecuador.", "La altura de una montaña.", "La distancia que hay hasta el mar.", "El grosor de la atmósfera."], hint: "Nos dice lo cerca o lejos que estamos del 'cinturón' de la Tierra." },
    { q: "¿Cuáles son las tres grandes zonas climáticas de la Tierra según su latitud?", correct: "Cálida, templada y fría.", options: ["Cálida, templada y fría.", "Lluviosa, seca y nevada.", "Continental, oceánica y mediterránea.", "Norte, sur y ecuatorial."], hint: "Una hace mucho calor, otra mucho frío, y otra está en medio." },
    { q: "¿Qué ocurre con la temperatura a medida que subimos en altitud (por ejemplo, subiendo una montaña)?", correct: "La temperatura baja.", options: ["La temperatura baja.", "La temperatura sube.", "La temperatura se mantiene igual.", "La temperatura desaparece."], hint: "En la cima de las montañas suele haber nieve." },
    { q: "¿Por qué hay mayor temperatura a menor altitud (más cerca del nivel del mar)?", correct: "Porque el suelo hace de retenedor térmico.", options: ["Porque el suelo hace de retenedor térmico.", "Porque el aire pesa más.", "Porque no hay nubes que tapen el sol.", "Porque el agua de los ríos calienta la tierra."], hint: "El suelo absorbe el calor y lo guarda." },
    { q: "¿Cómo afecta la cercanía del mar a las temperaturas?", correct: "Las hace más suaves, ya que el agua hace de termostato.", options: ["Las hace más suaves, ya que el agua hace de termostato.", "Las hace mucho más frías todo el año.", "Provoca olas de calor extremas.", "No afecta en nada a la temperatura."], hint: "El mar evita que haga muchísimo frío en invierno y muchísimo calor en verano." },
    { q: "¿Por qué las zonas cercanas al mar suelen tener más precipitaciones?", correct: "Por la mayor concentración de humedad que aporta el mar.", options: ["Por la mayor concentración de humedad que aporta el mar.", "Porque hay más montañas.", "Porque el aire es más frío.", "Porque la presión siempre es alta."], hint: "El agua del mar se evapora y crea nubes." },

    // Elementos climáticos y herramientas
    { q: "¿Qué es la temperatura atmosférica?", correct: "El grado de calor que hay en la atmósfera.", options: ["El grado de calor que hay en la atmósfera.", "El grado de vapor de agua en el aire.", "El peso del aire sobre la superficie.", "La velocidad a la que se mueven las nubes."], hint: "Suele medirse en grados Celsius (ºC)." },
    { q: "¿Con qué instrumento se mide la temperatura?", correct: "Con el termómetro.", options: ["Con el termómetro.", "Con el barómetro.", "Con el higrómetro.", "Con la veleta."], hint: "Empieza por 'Termo' (calor)." },
    { q: "¿Qué es la amplitud térmica?", correct: "La diferencia entre la temperatura máxima y la mínima.", options: ["La difference entre la temperatura máxima y la mínima.", "La temperatura media de toda una semana.", "La temperatura más alta alcanzada en el día.", "La temperatura del agua del mar."], hint: "Es la resta entre el momento más caluroso y el más frío." },
    { q: "¿Qué es la humedad?", correct: "El grado de vapor de agua que hay en la atmósfera.", options: ["El grado de vapor de agua que hay en la atmósfera.", "La cantidad de agua que cae al suelo en forma de lluvia.", "La niebla de las mañanas.", "El rocío sobre las plantas."], hint: "Procede de la evaporación de mares y ríos." },
    { q: "¿Con qué instrumento se mide la humedad de la atmósfera?", correct: "Con el higrómetro.", options: ["Con el higrómetro.", "Con el pluviómetro.", "Con el barómetro.", "Con el anemómetro."], hint: "Empieza por 'Higro'." },
    { q: "¿Qué es la precipitación?", correct: "La cantidad de agua que cae en la superficie terrestre (agua, nieve o granizo).", options: ["La cantidad de agua que cae en la superficie terrestre (agua, nieve o granizo).", "El vapor de agua invisible del aire.", "El agua subterránea de los ríos.", "La formación de nubes en el cielo."], hint: "Lo que hace que nos mojemos en invierno." },
    { q: "¿Con qué instrumento se mide la precipitación?", correct: "Con el pluviómetro.", options: ["Con el pluviómetro.", "Con el barómetro.", "Con el higrómetro.", "Con la veleta."], hint: "Pluvio significa lluvia en latín." },
    { q: "¿Qué es la presión atmosférica?", correct: "Es la fuerza que ejerce la atmósfera sobre la superficie terrestre.", options: ["Es la fuerza que ejerce la atmósfera sobre la superficie terrestre.", "La fuerza del viento al chocar con las montañas.", "El calor que desprende el núcleo de la Tierra.", "La cantidad de nubes en el cielo."], hint: "Es, literalmente, lo que pesa el aire." },
    { q: "¿Con qué instrumento se mide la presión atmosférica?", correct: "Con el barómetro.", options: ["Con el barómetro.", "Con el pluviómetro.", "Con el higrómetro.", "Con el anemómetro."], hint: "Mide la presión en 'bares' o 'milibares'." },
    { q: "¿Qué son los anticiclones?", correct: "Zonas de altas presiones (más de 1013 milibares) que repelen a las nubes y traen buen tiempo.", options: ["Zonas de altas presiones (más de 1013 milibares) que repelen a las nubes y traen buen tiempo.", "Zonas de bajas presiones que traen tormentas.", "Vientos muy fuertes como tifones.", "Lluvias torrenciales continuadas."], hint: "En el mapa del tiempo se marcan con una gran letra 'A'." },
    { q: "¿Qué son las borrascas?", correct: "Zonas de bajas presiones (menos de 1013 milibares) que atraen a las nubes y traen mal tiempo.", options: ["Zonas de bajas presiones (menos de 1013 milibares) que atraen a las nubes y traen mal tiempo.", "Zonas de altas presiones con días soleados.", "Vientos suaves y agradables.", "Tormentas de nieve exclusivas de las montañas."], hint: "En el mapa del tiempo se marcan con una gran letra 'B'." },
    { q: "¿Qué instrumentos usamos para medir la velocidad y la dirección del viento?", correct: "El anemómetro (velocidad) y la veleta (dirección).", options: ["El anemómetro (velocidad) y la veleta (dirección).", "El barómetro y el higrómetro.", "El pluviómetro y el termómetro.", "El sismógrafo y el higrómetro."], hint: "Uno da vueltas rápido y el otro tiene forma de flecha (o un gallo)." },

    // Bioclimas y Sistema Köppen
    { q: "En el Sistema Köppen, ¿qué elementos principales se usan para clasificar los climas?", correct: "La temperatura y las precipitaciones.", options: ["La temperatura y las precipitaciones.", "La latitud y los vientos.", "La presión atmosférica y la humedad.", "La altitud y los terremotos."], hint: "Son los mismos datos que dibujamos en un climograma." },
    { q: "Según el sistema Köppen, ¿qué son los bioclimas forestales?", correct: "Los que por sus condiciones tienen un gran nivel de vegetación y biodiversidad.", options: ["Los que por sus condiciones tienen un gran nivel de vegetación y biodiversidad.", "Los que no tienen nada de vegetación por exceso de frío o calor.", "Los que solo se dan en la cima de las altas montañas.", "Los que no podemos localizar en un punto concreto."], hint: "Forestal significa relativo a los bosques." },
    { q: "¿Cuáles son las tres variantes del bioclima forestal CÁLIDO?", correct: "Ecuatorial, de sabana y monzónico.", options: ["Ecuatorial, de sabana y monzónico.", "Chino, mediterráneo y oceánico.", "Continental, de montaña y polar.", "Desértico, tropical y frío."], hint: "Típicos de sitios como Brasil, Tanzania o Tailandia." },
    { q: "¿Cuáles son las tres variantes del bioclima forestal TEMPLADO?", correct: "Chino, mediterráneo y oceánico.", options: ["Chino, mediterráneo y oceánico.", "Ecuatorial, de sabana y monzónico.", "Polar, continental y estepario.", "De selva, de jungla y montañoso."], hint: "España tiene dos de estos climas (el del centro/sur y el del norte)." },
    { q: "¿Qué característica de temperatura tienen los bioclimas templados?", correct: "Temperaturas suaves en otoño y primavera, y extremas en invierno y verano.", options: ["Temperaturas suaves en otoño y primavera, y extremas en invierno y verano.", "Temperaturas bajo cero durante todo el año.", "Calor sofocante todos los meses del año.", "Sin cambios de temperatura entre estaciones."], hint: "Es exactamente lo que pasa en España a lo largo del año." },
    { q: "¿Cuál es la variante única que pertenece al bioclima forestal FRÍO?", correct: "El clima continental.", options: ["El clima continental.", "El clima oceánico.", "El clima mediterráneo.", "El clima de sabana."], hint: "Es el clima de países como Rusia, Canadá o Noruega." }
];

// =====================================
// ESTADOS Y VARIABLES
// =====================================
let currentQuestions = [];
let currentIndex = 0;
let correctAnswers = 0;
let wrongAnswers = 0;
let mistakes = [];
let reviewMode = false;
const QUESTIONS_PER_TEST = 30;

// Elementos DOM
const questionText = document.getElementById("question-text");
const optionsContainer = document.getElementById("options-container");
const nextBtn = document.getElementById("next-btn");
const correctCount = document.getElementById("correct-count");
const wrongCount = document.getElementById("wrong-count");
const questionNumber = document.getElementById("question-number");
const questionTotal = document.getElementById("question-total");
const progressBar = document.getElementById("progress-bar");
const quizScreen = document.getElementById("quiz-screen");
const resultScreen = document.getElementById("result-screen");
const resultTitle = document.getElementById("result-title");
const finalScore = document.getElementById("final-score");
const finalPercentage = document.getElementById("final-percentage");
const mistakesSection = document.getElementById("mistakes-section");
const mistakesList = document.getElementById("mistakes-list");
const reviewBtn = document.getElementById("review-btn");
const restartBtn = document.getElementById("restart-btn");
const modeBadge = document.getElementById("mode-badge");

// =====================================
// UTILIDADES
// =====================================
function shuffle(array){
    const arr = [...array];
    for(let i = arr.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// =====================================
// LÓGICA DEL TEST
// =====================================
function startMainTest(){
    currentIndex = 0; correctAnswers = 0; wrongAnswers = 0; mistakes = [];
    currentQuestions = shuffle(questionPool).slice(0, QUESTIONS_PER_TEST);
    reviewMode = false;
    
    questionTotal.textContent = currentQuestions.length;
    showQuizScreen();
    renderQuestion();
}

function startReviewMode(){
    currentIndex = 0; correctAnswers = 0; wrongAnswers = 0;
    currentQuestions = shuffle(mistakes);
    reviewMode = true;
    
    questionTotal.textContent = currentQuestions.length;
    showQuizScreen();
    renderQuestion();
}

function renderQuestion(){
    nextBtn.classList.add("hidden");
    updateStats();

    const item = currentQuestions[currentIndex];
    questionText.textContent = item.q;
    questionNumber.textContent = currentIndex + 1;
    progressBar.style.width = `${((currentIndex) / currentQuestions.length) * 100}%`;

    const shuffledOptions = shuffle(item.options);
    optionsContainer.innerHTML = "";

    shuffledOptions.forEach(option => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `<span>${option}</span>`;

        btn.addEventListener("click", () => {
            const buttons = document.querySelectorAll(".option-btn");
            buttons.forEach(b => {
                b.disabled = true;
                if(b.textContent === item.correct){
                    b.classList.add("correct-answer");
                }
            });

            if(option === item.correct){
                correctAnswers++;
            } else {
                wrongAnswers++;
                btn.classList.add("wrong-answer");

                const hintSpan = document.createElement("span");
                hintSpan.className = "hint";
                hintSpan.innerHTML = `💡 <strong>Pista:</strong> ${item.hint}`;
                
                buttons.forEach(b => {
                    if(b.textContent === item.correct){
                        b.appendChild(hintSpan);
                    }
                });

                if(!mistakes.includes(item)){
                    mistakes.push(item);
                }
            }
            updateStats();
            nextBtn.classList.remove("hidden");
        });
        optionsContainer.appendChild(btn);
    });
}

function nextQuestion(){
    currentIndex++;
    if(currentIndex < currentQuestions.length){
        renderQuestion();
    } else {
        showResults();
    }
}

function showResults(){
    quizScreen.classList.add("hidden");
    resultScreen.classList.remove("hidden");

    const total = currentQuestions.length;
    const percentage = Math.round((correctAnswers / total) * 100);

    finalScore.textContent = `${correctAnswers} / ${total}`;
    finalPercentage.textContent = `${percentage}%`;

    if(percentage >= 85){
        resultTitle.textContent = "🏆 ¡Impresionante, Dani!";
        resultTitle.className = "result-title success";
    } else {
        resultTitle.textContent = "❌ ¡No te rindas, repasa tus fallos!";
        resultTitle.className = "result-title fail";
    }

    if(mistakes.length > 0 && !reviewMode){
        mistakesSection.classList.remove("hidden");
        mistakesList.innerHTML = "";
        mistakes.forEach(questionObj => {
            const li = document.createElement("li");
            li.innerHTML = `<strong>${questionObj.q}</strong><br>Respuesta correcta: <span class="correct">${questionObj.correct}</span>`;
            mistakesList.appendChild(li);
        });
    } else {
        mistakesSection.classList.add("hidden");
    }
}

function updateStats(){
    correctCount.textContent = correctAnswers;
    wrongCount.textContent = wrongAnswers;
    modeBadge.textContent = reviewMode ? "MODO REPASO DE ERRORES" : `TEST PRINCIPAL (${QUESTIONS_PER_TEST} PREGUNTAS)`;
}

function showQuizScreen(){
    resultScreen.classList.add("hidden");
    quizScreen.classList.remove("hidden");
}

nextBtn.addEventListener("click", nextQuestion);
restartBtn.addEventListener("click", startMainTest);
reviewBtn.addEventListener("click", startReviewMode);

startMainTest();
</script>
</body>
</html>
