<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />

<title>Dani: Repaso de Lengua</title>

<style>
*{ box-sizing:border-box; }
body{
margin:0; padding:20px;
font-family: 'Segoe UI', Arial, sans-serif;
background:#eef3f8; color:#2c3e50;
}
.container{
max-width:800px; margin:auto;
background:white; border-radius:16px;
padding:30px; box-shadow:0 4px 18px rgba(0,0,0,0.1);
}
h1{ margin-top:0; color:#8e44ad; }
.top-bar{
display:flex; justify-content:space-between; align-items:center;
gap:10px; flex-wrap:wrap; margin-bottom:20px;
}
.stats{ display:flex; gap:20px; font-weight:bold; }
.correct{ color:#1e9b50; }
.wrong{ color:#c0392b; }
.progress-wrapper{
width:100%; background:#dfe6ee; border-radius:999px;
overflow:hidden; height:18px; margin:20px 0;
}
.progress-bar{
height:100%; width:0%; background:#8e44ad; transition:0.3s;
}
.question{
font-size:1.4rem; font-weight:bold; margin:30px 0; min-height:70px; line-height: 1.3;
}
.options{
display:grid; grid-template-columns:1fr 1fr; gap:14px;
}
button{
border:none; border-radius:10px; padding:16px;
cursor:pointer; font-size:1rem; transition:0.2s;
}
.option-btn{
background:white; border:2px solid #8e44ad; color:#8e44ad;
min-height:70px; font-weight:600;
}
.option-btn:hover:not(:disabled){
background:#8e44ad; color:white;
}
.option-btn:disabled{ cursor:default; }
.correct-answer{
background:#1e9b50 !important; border-color:#1e9b50 !important; color:white !important;
}
.wrong-answer{
background:#c0392b !important; border-color:#c0392b !important; color:white !important;
}
.hint{
display:block; margin-top:8px; font-size:0.85rem; opacity:0.95; font-style: italic;
}
.next-btn, .restart-btn, .review-btn{
margin-top:25px; width:100%; background:#2c3e50;
color:white; font-weight:bold; font-size:1rem;
}
.next-btn:hover, .restart-btn:hover, .review-btn:hover{ opacity:0.9; }
.hidden{ display:none; }
.result-title{ font-size:2rem; margin-bottom:10px; }
.success{ color:#1e9b50; }
.fail{ color:#c0392b; }
.error-list{
text-align:left; margin-top:20px; background:#f7f9fc;
padding:15px; border-radius:10px;
}
.error-list li{ margin-bottom:8px; }
.mode-badge{
background:#8e44ad; color:white; padding:6px 12px;
border-radius:999px; font-size:0.9rem; font-weight:bold;
}
@media(max-width:650px){
.options{ grid-template-columns:1fr; }
.question{ font-size:1.15rem; }
.top-bar{ flex-direction:column; align-items:flex-start; }
}
</style>
</head>

<body>
<div class="container">
<div id="quiz-screen">
<div class="top-bar">
<h1>📚 Repaso de Lengua: Verbos y Ortografía</h1>
<div class="mode-badge" id="mode-badge">Test Principal</div>
</div>

<div class="top-bar">
<div>Pregunta <strong><span id="question-number">1</span> / <span id="question-total">40</span></strong></div>

<span class="correct">✅ <span id="correct-count">0</span></span>
<span class="wrong">❌ <span id="wrong-count">0</span></span>

</div>

<div class="progress-wrapper">

</div>

<div class="options" id="options-container"></div>
<button class="next-btn hidden" id="next-btn">Siguiente Pregunta →</button>
</div>

<div id="result-screen" class="hidden">
<h2 class="result-title" id="result-title"></h2>
<p>Aciertos: <strong id="final-score"></strong></p>
<p>Porcentaje: <strong id="final-percentage"></strong></p>

<div id="mistakes-section" class="hidden">

<button class="review-btn" id="review-btn">Practicar Errores</button>
</div>
<button class="restart-btn" id="restart-btn">Reiniciar Test Completo</button>
</div>
</div>

{ q: "¿Lleva diéresis 'Guitarra'?", options: ["No, Guitarra", "Sí, Güitarra", "A veces", "Con tilde"], correct: "No, Guitarra", hint: "La U es muda." },
{ q: "¿Lleva diéresis 'Guisante'?", options: ["No, Guisante", "Sí, Güisante", "A veces", "Con tilde"], correct: "No, Guisante", hint: "La U es muda." },
{ q: "¿Lleva diéresis 'Guepardo'?", options: ["No, Guepardo", "Sí, Güepardo", "A veces", "Con tilde"], correct: "No, Guepardo", hint: "La U es muda." },
{ q: "¿Lleva diéresis 'Albergue'?", options: ["No, Albergue", "Sí, Albergüe", "A veces", "Con tilde"], correct: "No, Albergue", hint: "La U es muda." },
{ q: "¿Lleva diéresis 'Miguel'?", options: ["No, Miguel", "Sí, Migüel", "A veces", "Con tilde"], correct: "No, Miguel", hint: "La U es muda." }
];

// =====================================
// ESTADOS Y VARIABLES
// =====================================
let currentQuestions = [];
let currentIndex = 0;
let correctAnswers = 0;
let wrongAnswers = 0;
let mistakes = [];
let reviewMode = false;

// Elementos DOM
const questionText = document.getElementById("question-text");
const optionsContainer = document.getElementById("options-container");
const nextBtn = document.getElementById("next-btn");
const correctCount = document.getElementById("correct-count");
const wrongCount = document.getElementById("wrong-count");
const questionNumber = document.getElementById("question-number");
const questionTotal = document.getElementById("question-total");
const progressBar = document.getElementById("progress-bar");
const quizScreen = document.getElementById("quiz-screen");
const resultScreen = document.getElementById("result-screen");
const resultTitle = document.getElementById("result-title");
const finalScore = document.getElementById("final-score");
const finalPercentage = document.getElementById("final-percentage");
const mistakesSection = document.getElementById("mistakes-section");
const mistakesList = document.getElementById("mistakes-list");
const reviewBtn = document.getElementById("review-btn");
const restartBtn = document.getElementById("restart-btn");
const modeBadge = document.getElementById("mode-badge");

// =====================================
// UTILIDADES
// =====================================
function shuffle(array){
const arr = [...array];
for(let i = arr.length - 1; i > 0; i--){
const j = Math.floor(Math.random() * (i + 1));
[arr[i], arr[j]] = [arr[j], arr[i]];
}
return arr;
}

// =====================================
// LÓGICA DEL TEST
// =====================================
function startMainTest(){
currentIndex = 0; correctAnswers = 0; wrongAnswers = 0; mistakes = [];

// Proporciones exactas solicitadas: 30 verbos, 7 GJ, 3 diéresis (TOTAL 40)
let verbosSeleccionados = shuffle([...verbosPool]).slice(0, 30);
let gjSeleccionados = shuffle([...ortografiaGJPool]).slice(0, 7);
let dieresisSeleccionados = shuffle([...ortografiaDieresisPool]).slice(0, 3);

// Unir y mezclar el examen final
currentQuestions = shuffle([...verbosSeleccionados, ...gjSeleccionados, ...dieresisSeleccionados]);

reviewMode = false;
questionTotal.textContent = currentQuestions.length;
showQuizScreen();
renderQuestion();
}

function startReviewMode(){
currentIndex = 0; correctAnswers = 0; wrongAnswers = 0;
currentQuestions = shuffle(mistakes);
reviewMode = true;
questionTotal.textContent = currentQuestions.length;
showQuizScreen();
renderQuestion();
}

function renderQuestion(){
nextBtn.classList.add("hidden");
updateStats();

const item = currentQuestions[currentIndex];
questionText.textContent = item.q;
questionNumber.textContent = currentIndex + 1;
progressBar.style.width = `${((currentIndex) / currentQuestions.length) * 100}%`;

const shuffledOptions = shuffle(item.options);
optionsContainer.innerHTML = "";

shuffledOptions.forEach(option => {
const btn = document.createElement("button");
btn.className = "option-btn";
btn.textContent = option;

btn.addEventListener("click", () => {
const buttons = document.querySelectorAll(".option-btn");
buttons.forEach(b => {
b.disabled = true;
if(b.textContent === item.correct){
b.classList.add("correct-answer");
}
});

if(option === item.correct){
correctAnswers++;
} else {
wrongAnswers++;
btn.classList.add("wrong-answer");

const hintSpan = document.createElement("span");
hintSpan.className = "hint";
hintSpan.textContent = `💡 Pista: ${item.hint}`;
btn.appendChild(hintSpan);

if(!mistakes.includes(item)){
mistakes.push(item);
}
}
updateStats();
nextBtn.classList.remove("hidden");
});
optionsContainer.appendChild(btn);
});
}

function nextQuestion(){
currentIndex++;
if(currentIndex < currentQuestions.length){
renderQuestion();
} else {
showResults();
}
}

function showResults(){
quizScreen.classList.add("hidden");
resultScreen.classList.remove("hidden");

const total = currentQuestions.length;
const percentage = Math.round((correctAnswers / total) * 100);

finalScore.textContent = `${correctAnswers} / ${total}`;
finalPercentage.textContent = `${percentage}%`;

if(percentage >= 85){
resultTitle.textContent = "🏆 ¡Excelente Trabajo!";
resultTitle.className = "result-title success";
} else {
resultTitle.textContent = "❌ ¡Sigue Practicando!";
resultTitle.className = "result-title fail";
}

if(mistakes.length > 0 && !reviewMode){
mistakesSection.classList.remove("hidden");
mistakesList.innerHTML = "";
mistakes.forEach(questionObj => {
const li = document.createElement("li");
li.innerHTML = `<strong>${questionObj.q}</strong><br>Respuesta: <span class="correct">${questionObj.correct}</span>`;
mistakesList.appendChild(li);
});
} else {
mistakesSection.classList.add("hidden");
}
}

function updateStats(){
correctCount.textContent = correctAnswers;
wrongCount.textContent = wrongAnswers;
modeBadge.textContent = reviewMode ? "Modo Repaso" : "Test Principal";
}

function showQuizScreen(){
resultScreen.classList.add("hidden");
quizScreen.classList.remove("hidden");
}

nextBtn.addEventListener("click", nextQuestion);
restartBtn.addEventListener("click", startMainTest);
reviewBtn.addEventListener("click", startReviewMode);

startMainTest();
</script>
</body>
</html>
