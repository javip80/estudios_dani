<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 Panel de Estudios de Dani</title>
<style>
body { 
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
background-color: #f0f4f8; 
margin: 0; 
display: flex; 
flex-direction: column; 
align-items: center; 
min-height: 100vh;
}
h1 { color: #2c3e50; margin-top: 40px; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
p { color: #7f8c8d; margin-bottom: 30px; }

.grid-container {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
gap: 20px;
max-width: 900px;
width: 90% ;
padding-bottom: 50px;
}

.card {
padding: 30px;
text-align: center;
text-decoration: none;
border-radius: 15px;
font-weight: bold;
font-size: 1.2em;
color: white;
box-shadow: 0 4px 15px rgba(0,0,0,0.1);
transition: transform 0.3s, box-shadow 0.3s;
display: flex;
flex-direction: column;
gap: 10px;
}

.card:hover {
transform: translateY(-5px);
box-shadow: 0 8px 25px rgba(0,0,0,0.2);
}

.card span { font-size: 2em; }

/* Colores por asignatura */
.frances { background-color: #3498db; }
.voc-ingles { background-color: #9b59b6; }
.verbos-ing { background-color: #8e44ad; }
.ingles { background-color: #2980b9; }
.lengua { background-color: #e67e22; }
.biologia { background-color: #27ae60; }
.geografia { background-color: #f1c40f; color: #2c3e50; }
.mates { background-color: #e74c3c; }
</style>
</head>
<body>

<a href="Ingles.html" class="card ingles"><span>📝</span>INGLÉS</a>
<a href="Lengua.html" class="card lengua"><span>📚</span>LENGUA</a>
<a href="Biologia.html" class="card biologia"><span>🧬</span>BIOLOGÍA</a>
<a href="Geografia.html" class="card geografia"><span>🌍</span>GEOGRAFÍA</a>

</div>

</body>
</html>
