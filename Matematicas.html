<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Test: Geometría</title>

<style>
*{ box-sizing:border-box; }
body{
    margin:0; padding:20px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:#f4e8f8; color:#333;
}
.container{
    max-width:900px; margin:auto;
    background:white; border-radius:16px;
    padding:30px; box-shadow:0 8px 24px rgba(0,0,0,0.1);
}
h1{ margin-top:0; color:#8e44ad; font-size: 1.8rem;}
.top-bar{
    display:flex; justify-content:space-between; align-items:center;
    gap:10px; flex-wrap:wrap; margin-bottom:20px;
}
.stats{ display:flex; gap:20px; font-weight:bold; font-size:1.1rem; }
.correct{ color:#27ae60; }
.wrong{ color:#c0392b; }
.progress-wrapper{
    width:100%; background:#e2e8f0; border-radius:999px;
    overflow:hidden; height:20px; margin:20px 0;
}
.progress-bar{
    height:100%; width:0%; background:#8e44ad; transition:0.4s ease-out;
}
.question{
    font-size:1.3rem; font-weight:bold; margin:25px 0; min-height:80px; line-height:1.4;
}
.options{
    display:grid; grid-template-columns:1fr 1fr; gap:15px;
}
button{
    border:none; border-radius:12px; padding:18px;
    cursor:pointer; font-size:1.1rem; transition:all 0.2s;
}
.option-btn{
    background:white; border:2px solid #8e44ad; color:#8e44ad;
    min-height:85px; font-weight:600; display:flex; flex-direction:column; justify-content:center; align-items:center;
}
.option-btn:hover:not(:disabled){
    background:#8e44ad; color:white; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(142, 68, 173, 0.2);
}
.option-btn:disabled{ cursor:default; transform:none; }
.correct-answer{
    background:#27ae60 !important; border-color:#27ae60 !important; color:white !important;
}
.wrong-answer{
    background:#c0392b !important; border-color:#c0392b !important; color:white !important;
}
.hint{
    display:block; margin-top:8px; font-size:0.9rem; opacity:0.95; font-style: italic; font-weight:normal;
}
.next-btn, .restart-btn, .review-btn{
    margin-top:30px; width:100%; background:#2c3e50;
    color:white; font-weight:bold; font-size:1.2rem;
}
.next-btn:hover, .restart-btn:hover, .review-btn:hover{ background:#1a252f; }
.hidden{ display:none; }
.result-title{ font-size:2.5rem; margin-bottom:10px; }
.success{ color:#27ae60; }
.fail{ color:#c0392b; }
.error-list{
    text-align:left; margin-top:20px; background:#f8f9fa;
    padding:20px; border-radius:12px; border-left: 5px solid #c0392b;
}
.error-list li{ margin-bottom:12px; font-size: 1.1rem; line-height: 1.4; }
.mode-badge{
    background:#8e44ad; color:white; padding:8px 16px;
    border-radius:999px; font-size:1rem; font-weight:bold; text-transform:uppercase; letter-spacing:1px;
}
@media(max-width:650px){
    .options{ grid-template-columns:1fr; }
    .question{ font-size:1.2rem; }
    .top-bar{ flex-direction:column; align-items:flex-start; }
}
</style>
</head>

<body>
<div class="container">
    <div id="quiz-screen">
        <div class="top-bar">
            <h1>📐 Test: Cuadriláteros, Perímetros y Áreas</h1>
            <div class="mode-badge" id="mode-badge">TEST PRINCIPAL</div>
        </div>

        <div class="top-bar">
            <div>Pregunta <strong><span id="question-number">1</span> / <span id="question-total">40</span></strong></div>
            <div class="stats">
                <span class="correct">✅ <span id="correct-count">0</span></span>
                <span class="wrong">❌ <span id="wrong-count">0</span></span>
            </div>
        </div>

        <div class="progress-wrapper">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="question" id="question-text">Cargando...</div>
        <div class="options" id="options-container"></div>
        <button class="next-btn hidden" id="next-btn">Siguiente Pregunta →</button>
    </div>

    <div id="result-screen" class="hidden">
        <h2 class="result-title" id="result-title"></h2>
        <p style="font-size:1.5rem">Aciertos: <strong id="final-score"></strong></p>
        <p style="font-size:1.5rem">Porcentaje: <strong id="final-percentage"></strong></p>

        <div id="mistakes-section" class="hidden">
            <h3>Conceptos a repasar:</h3>
            <ul class="error-list" id="mistakes-list"></ul>
            <button class="review-btn" id="review-btn">Practicar Errores</button>
        </div>
        <button class="restart-btn" id="restart-btn">Generar Nuevo Test de 40 Preguntas</button>
    </div>
</div>

<script>
// =====================================
// BASE DE DATOS: 40 PREGUNTAS (Geometría)
// =====================================
const questionPool = [
    // --- CLASIFICACIÓN DE CUADRILÁTEROS ---
    { q: "¿Qué paralelogramo tiene 4 lados iguales y 4 ángulos rectos?", correct: "Cuadrado", options: ["Cuadrado", "Rectángulo", "Rombo", "Romboide"], hint: "Es la figura geométrica más simétrica." },
    { q: "¿Qué paralelogramo tiene lados iguales dos a dos y 4 ángulos rectos?", correct: "Rectángulo", options: ["Rectángulo", "Romboide", "Cuadrado", "Trapecio"], hint: "Es como un cuadrado estirado." },
    { q: "¿Qué figura tiene 4 lados iguales pero sus ángulos son iguales dos a dos (no rectos)?", correct: "Rombo", options: ["Rombo", "Cuadrado", "Romboide", "Trapecio isósceles"], hint: "Se parece a la forma de un diamante en las cartas." },
    { q: "¿Qué característica define al romboide?", correct: "Lados iguales dos a dos y ángulos iguales dos a dos (no rectos).", options: ["Lados iguales dos a dos y ángulos iguales dos a dos (no rectos).", "4 lados iguales y ángulos rectos.", "4 lados iguales pero sin ángulos rectos.", "Lados iguales dos a dos y 4 ángulos rectos."], hint: "Es parecido a un rectángulo inclinado." },
    { q: "¿Cuál es la principal característica de los paralelogramos?", correct: "Tienen sus lados paralelos dos a dos.", options: ["Tienen sus lados paralelos dos a dos.", "Tienen solo dos lados paralelos.", "Todos sus ángulos son rectos.", "No tienen lados paralelos."], hint: "Su propio nombre te da la pista." },
    { q: "¿Cuántos lados paralelos tienen los trapecios?", correct: "Tienen solo dos lados paralelos.", options: ["Tienen solo dos lados paralelos.", "Tienen cuatro lados paralelos dos a dos.", "No tienen ningún lado paralelo.", "Todos sus lados son iguales."], hint: "Piensa en la forma de una falda." },
    { q: "¿Qué característica tiene el trapecio rectángulo?", correct: "Tiene 2 ángulos rectos.", options: ["Tiene 2 ángulos rectos.", "Tiene 4 ángulos rectos.", "Sus lados no paralelos son iguales.", "No tiene lados iguales ni ángulos rectos."], hint: "Su nombre indica el tipo de ángulo que contiene." },
    { q: "¿Qué caracteriza a un trapecio isósceles?", correct: "Los lados no paralelos son iguales y sus ángulos son iguales dos a dos.", options: ["Los lados no paralelos son iguales y sus ángulos son iguales dos a dos.", "Tiene 2 ángulos rectos.", "No tiene lados iguales.", "Sus 4 lados son iguales."], hint: "Tiene la misma simetría que un triángulo isósceles." },
    { q: "Un trapecio que no tiene lados iguales y no tiene ningún ángulo recto se llama...", correct: "Trapecio escaleno.", options: ["Trapecio escaleno.", "Trapecio isósceles.", "Trapecio rectángulo.", "Romboide."], hint: "Comparte nombre con el triángulo que tiene todos sus lados distintos." },
    { q: "Según tu libro, si unimos dos trapecios rectángulos iguales por uno de sus lados, ¿qué figura NO obtendremos nunca?", correct: "Un círculo.", options: ["Un círculo.", "Un rectángulo.", "Un paralelogramo.", "Un trapecio isósceles."], hint: "Es la única figura que no tiene líneas rectas." },

    // --- FÓRMULAS DE PERÍMETRO Y ÁREA ---
    { q: "¿Cuál es la fórmula para calcular el perímetro de un triángulo equilátero cuyos 3 lados miden L?", correct: "P = L + L + L", options: ["P = L + L + L", "P = L × L", "P = 4L", "P = 2a + 2b"], hint: "El perímetro siempre es la suma de los bordes." },
    { q: "La fórmula del área de un triángulo es...", correct: "A = (b × h) / 2", options: ["A = (b × h) / 2", "A = b × h", "A = (B + b) × h / 2", "A = (D × d) / 2"], hint: "Es exactamente la mitad del área de un rectángulo." },
    { q: "¿Cómo se calcula el área de un cuadrado de lado L?", correct: "A = L × L", options: ["A = L × L", "P = 4L", "A = (L × L) / 2", "A = 2L"], hint: "Se multiplican sus dos dimensiones (base por altura)." },
    { q: "Para un rectángulo de base 'b' y altura 'a', ¿cuál es su perímetro?", correct: "P = 2a + 2b", options: ["P = 2a + 2b", "P = a × b", "P = a + b", "P = 4a"], hint: "Tiene dos lados de una medida y dos lados de otra." },
    { q: "¿Cuál es la fórmula del área del círculo?", correct: "A = π × r²", options: ["A = π × r²", "P = D × π", "A = 2 × π × r", "A = (π × r) / 2"], hint: "Necesitas elevar el radio al cuadrado." },
    { q: "Para hallar el perímetro del rombo cuyo lado mide 'a', usamos...", correct: "P = 4a", options: ["P = 4a", "P = 2a + 2b", "A = (D × d) / 2", "P = L × L"], hint: "Como tiene 4 lados iguales, es igual que el del cuadrado." },
    { q: "¿Qué variables necesitas para calcular el área del rombo?", correct: "La diagonal mayor (D) y la diagonal menor (d).", options: ["La diagonal mayor (D) y la diagonal menor (d).", "La base y la altura.", "El radio y el diámetro.", "El perímetro y la apotema."], hint: "Necesitas las dos líneas interiores que se cruzan." },
    { q: "En polígonos regulares como el pentágono o el hexágono, ¿qué es 'a' en la fórmula de su área?", correct: "La apotema.", options: ["La apotema.", "La altura.", "El ancho.", "El área."], hint: "Es una línea que va del centro al medio de uno de sus lados." },
    { q: "¿Cuál es la fórmula del área para un pentágono o hexágono regular?", correct: "A = (P × a) / 2", options: ["A = (P × a) / 2", "A = P × a", "A = (B × h) / 2", "A = P + a"], hint: "Perímetro por apotema, partido por dos." },
    { q: "¿Cuál es la fórmula correcta del área del trapecio?", correct: "A = (B + b) × h / 2", options: ["A = (B + b) × h / 2", "A = (B × b) / 2", "A = B × h", "A = (D × d) / 2"], hint: "Suma de las bases, por la altura, entre dos." },
    { q: "¿Cómo se halla el área del paralelogramo (romboide)?", correct: "A = b × h", options: ["A = b × h", "A = (b × h) / 2", "P = 2a + 2b", "A = (D × d) / 2"], hint: "Se calcula exactamente igual que el rectángulo." },
    { q: "¿Qué elemento usamos en el cálculo del perímetro del círculo según la tabla?", correct: "El diámetro (D).", options: ["El diámetro (D).", "El radio al cuadrado (r²).", "La diagonal (d).", "La apotema (a)."], hint: "Es la línea recta que cruza todo el círculo pasando por el centro." },
    { q: "¿Cuál es el cuadrilátero con un par de lados paralelos llamados base mayor (B) y base menor (b)?", correct: "El trapecio.", options: ["El trapecio.", "El rectángulo.", "El rombo.", "El cuadrado."], hint: "Fíjate en su fórmula del área." },
    { q: "La fórmula del perímetro de un polígono cualquiera...", correct: "Es la suma de las longitudes de todos sus lados exteriores.", options: ["Es la suma de las longitudes de todos sus lados exteriores.", "Siempre incluye dividir por dos.", "Se calcula con la apotema.", "Es base por altura."], hint: "Piensa en el perímetro como la valla que rodea una parcela." },

    // --- CÁLCULO PRÁCTICO ---
    { q: "Calcula el área de un cuadrado cuyo lado mide 5 cm.", correct: "25 cm²", options: ["25 cm²", "20 cm", "10 cm²", "12.5 cm²"], hint: "Multiplica el lado por sí mismo." },
    { q: "¿Cuál es el perímetro de un hexágono regular de lado 4 cm?", correct: "24 cm", options: ["24 cm", "20 cm", "16 cm", "10 cm"], hint: "El hexágono tiene 6 lados." },
    { q: "Si la base de un rectángulo es 7 y su altura 3, ¿cuál es su área?", correct: "21", options: ["21", "20", "10", "10.5"], hint: "Base por altura." },
    { q: "Calcula el área de un triángulo de base 10 y altura 6.", correct: "30", options: ["30", "60", "16", "15"], hint: "Base por altura... ¡y no olvides dividir entre 2!" },
    { q: "¿Cuál es el área de un rombo cuya diagonal mayor es 8 y diagonal menor es 4?", correct: "16", options: ["16", "32", "12", "24"], hint: "Multiplica las diagonales y divide entre 2." },
    { q: "Un trapecio tiene base mayor B=8, base menor b=2 y altura h=4. ¿Cuál es su área?", correct: "20", options: ["20", "40", "16", "10"], hint: "Suma las bases (10), multiplica por la altura (40) y divide a la mitad." },
    { q: "En el círculo, si el diámetro vale 10, ¿qué valor usamos para el radio (r)?", correct: "r = 5", options: ["r = 5", "r = 10", "r = 20", "r = 3.14"], hint: "El radio es exactamente la mitad del diámetro." },
    { q: "El perímetro de un rectángulo mide 20 cm. Si su base es 6 cm, ¿cuánto mide su altura?", correct: "4 cm", options: ["4 cm", "14 cm", "7 cm", "2 cm"], hint: "Si tiene dos bases de 6 (12), faltan 8 cm para repartir entre sus dos alturas." },
    { q: "Si el área de un paralelogramo es 24 y su base es 6, ¿cuál es su altura?", correct: "4", options: ["4", "18", "144", "8"], hint: "¿Qué número multiplicado por 6 da 24?" },
    { q: "Un pentágono regular tiene 4 cm de lado. Su apotema es 2.75 cm. ¿Cuál es su perímetro?", correct: "20 cm", options: ["20 cm", "27.5 cm²", "16 cm", "11 cm"], hint: "El perímetro es solo la suma de los lados exteriores (5 lados)." },
    { q: "¿Cuál es la fórmula correcta para calcular el área de un círculo si sabes que π = 3.1416?", correct: "A = π × r²", options: ["A = π × r²", "P = D × π", "A = (D × π) / 2", "A = r × π"], hint: "Eleva el radio al cuadrado." },
    { q: "Calcula el área de un rectángulo de lados a=5 y b=2.", correct: "10", options: ["10", "14", "7", "25"], hint: "Base por altura." },
    { q: "Para un polígono de perímetro P=30 y apotema a=2, ¿cuál es su área?", correct: "30", options: ["30", "60", "15", "32"], hint: "P × a / 2." },
    { q: "Un rombo tiene perímetro P=40. ¿Cuánto vale su lado (a)?", correct: "10", options: ["10", "20", "4", "8"], hint: "El rombo tiene 4 lados iguales, divide el perímetro entre 4." },
    { q: "¿Qué ocurre si en el área de un triángulo la base es 8 y la altura es 8?", correct: "Su área es 32.", options: ["Su área es 32.", "Su área es 64.", "Su área es 16.", "Su perímetro es 32."], hint: "8 por 8 es 64, entre 2." },
    { q: "Una mesa redonda tiene un diámetro de 2 metros. Para calcular su perímetro (el borde), usaremos la fórmula...", correct: "P = 2 × 3.1416", options: ["P = 2 × 3.1416", "A = 3.1416 × 2²", "P = 2 × 2", "A = 2 + 3.1416"], hint: "La fórmula es Diámetro por Pi." }
];

// =====================================
// ESTADOS Y VARIABLES
// =====================================
let currentQuestions = [];
let currentIndex = 0;
let correctAnswers = 0;
let wrongAnswers = 0;
let mistakes = [];
let reviewMode = false;
const QUESTIONS_PER_TEST = 40;

// Elementos DOM
const questionText = document.getElementById("question-text");
const optionsContainer = document.getElementById("options-container");
const nextBtn = document.getElementById("next-btn");
const correctCount = document.getElementById("correct-count");
const wrongCount = document.getElementById("wrong-count");
const questionNumber = document.getElementById("question-number");
const questionTotal = document.getElementById("question-total");
const progressBar = document.getElementById("progress-bar");
const quizScreen = document.getElementById("quiz-screen");
const resultScreen = document.getElementById("result-screen");
const resultTitle = document.getElementById("result-title");
const finalScore = document.getElementById("final-score");
const finalPercentage = document.getElementById("final-percentage");
const mistakesSection = document.getElementById("mistakes-section");
const mistakesList = document.getElementById("mistakes-list");
const reviewBtn = document.getElementById("review-btn");
const restartBtn = document.getElementById("restart-btn");
const modeBadge = document.getElementById("mode-badge");

// =====================================
// UTILIDADES
// =====================================
function shuffle(array){
    const arr = [...array];
    for(let i = arr.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// =====================================
// LÓGICA DEL TEST
// =====================================
function startMainTest(){
    currentIndex = 0; correctAnswers = 0; wrongAnswers = 0; mistakes = [];
    currentQuestions = shuffle(questionPool).slice(0, QUESTIONS_PER_TEST);
    reviewMode = false;
    
    questionTotal.textContent = currentQuestions.length;
    showQuizScreen();
    renderQuestion();
}

function startReviewMode(){
    currentIndex = 0; correctAnswers = 0; wrongAnswers = 0;
    currentQuestions = shuffle(mistakes);
    reviewMode = true;
    
    questionTotal.textContent = currentQuestions.length;
    showQuizScreen();
    renderQuestion();
}

function renderQuestion(){
    nextBtn.classList.add("hidden");
    updateStats();

    const item = currentQuestions[currentIndex];
    questionText.textContent = item.q;
    questionNumber.textContent = currentIndex + 1;
    progressBar.style.width = `${((currentIndex) / currentQuestions.length) * 100}%`;

    const shuffledOptions = shuffle(item.options);
    optionsContainer.innerHTML = "";

    shuffledOptions.forEach(option => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `<span>${option}</span>`;

        btn.addEventListener("click", () => {
            const buttons = document.querySelectorAll(".option-btn");
            buttons.forEach(b => {
                b.disabled = true;
                if(b.textContent === item.correct){
                    b.classList.add("correct-answer");
                }
            });

            if(option === item.correct){
                correctAnswers++;
            } else {
                wrongAnswers++;
                btn.classList.add("wrong-answer");

                const hintSpan = document.createElement("span");
                hintSpan.className = "hint";
                hintSpan.innerHTML = `💡 <strong>Pista:</strong> ${item.hint}`;
                
                buttons.forEach(b => {
                    if(b.textContent === item.correct){
                        b.appendChild(hintSpan);
                    }
                });

                if(!mistakes.includes(item)){
                    mistakes.push(item);
                }
            }
            updateStats();
            nextBtn.classList.remove("hidden");
        });
        optionsContainer.appendChild(btn);
    });
}

function nextQuestion(){
    currentIndex++;
    if(currentIndex < currentQuestions.length){
        renderQuestion();
    } else {
        showResults();
    }
}

function showResults(){
    quizScreen.classList.add("hidden");
    resultScreen.classList.remove("hidden");

    const total = currentQuestions.length;
    const percentage = Math.round((correctAnswers / total) * 100);

    finalScore.textContent = `${correctAnswers} / ${total}`;
    finalPercentage.textContent = `${percentage}%`;

    if(percentage >= 85){
        resultTitle.textContent = "🏆 ¡Impresionante, Dani!";
        resultTitle.className = "result-title success";
    } else {
        resultTitle.textContent = "❌ ¡No te rindas, repasa tus fallos!";
        resultTitle.className = "result-title fail";
    }

    if(mistakes.length > 0 && !reviewMode){
        mistakesSection.classList.remove("hidden");
        mistakesList.innerHTML = "";
        mistakes.forEach(questionObj => {
            const li = document.createElement("li");
            li.innerHTML = `<strong>${questionObj.q}</strong><br>Respuesta correcta: <span class="correct">${questionObj.correct}</span>`;
            mistakesList.appendChild(li);
        });
    } else {
        mistakesSection.classList.add("hidden");
    }
}

function updateStats(){
    correctCount.textContent = correctAnswers;
    wrongCount.textContent = wrongAnswers;
    modeBadge.textContent = reviewMode ? "MODO REPASO DE ERRORES" : `TEST PRINCIPAL (${QUESTIONS_PER_TEST} PREGUNTAS)`;
}

function showQuizScreen(){
    resultScreen.classList.add("hidden");
    quizScreen.classList.remove("hidden");
}

nextBtn.addEventListener("click", nextQuestion);
restartBtn.addEventListener("click", startMainTest);
reviewBtn.addEventListener("click", startReviewMode);

startMainTest();
</script>
</body>
</html>
