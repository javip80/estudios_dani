
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dani · Irregular Verbs 1–15</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  padding: 18px;
  background: #eef3f8;
  color: #233345;
  font-family: Segoe UI, Arial, sans-serif;
}
main {
  max-width: 900px;
  margin: auto;
  padding: 28px;
  background: #fff;
  border-radius: 18px;
  box-shadow: 0 5px 20px #0001;
}
h1 {
  margin: 0;
  color: #1f6fb2;
}
.sub {
  color: #64748b;
}
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.stats {
  display: flex;
  gap: 18px;
  font-weight: bold;
}
.green { color: #18854a; }
.red { color: #bd3434; }
.progress {
  height: 14px;
  background: #dfe6ee;
  border-radius: 20px;
  overflow: hidden;
  margin: 23px 0;
}
.bar {
  height: 100%;
  width: 0;
  background: #1f6fb2;
  transition: width .2s;
}
.question {
  font-size: 1.45rem;
  font-weight: bold;
  margin: 20px 0 24px;
  min-height: 55px;
}
.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
button {
  font: inherit;
  font-weight: 650;
  cursor: pointer;
  padding: 16px;
  border-radius: 10px;
  min-height: 62px;
}
.option {
  background: white;
  border: 2px solid #1f6fb2;
  color: #1f6fb2;
}
.option:hover:not(:disabled) {
  background: #edf6ff;
}
.option.correct {
  background: #18854a;
  color: white;
  border-color: #18854a;
}
.option.wrong {
  background: #bd3434;
  color: white;
  border-color: #bd3434;
}
.option:disabled {
  cursor: default;
}
.action {
  display: block;
  width: 100%;
  margin-top: 20px;
  border: 0;
  background: #233345;
  color: white;
}
.hidden {
  display: none !important;
}
.feedback {
  margin-top: 16px;
  padding: 14px;
  background: #f0f5fa;
  border-radius: 10px;
  line-height: 1.6;
}
table {
  border-collapse: collapse;
  width: 100%;
  margin: 15px 0;
}
th, td {
  padding: 10px;
  border-bottom: 1px solid #dae2e9;
  text-align: left;
  white-space: nowrap;
}
th {
  background: #e9f2fb;
}
@media(max-width:600px) {
  main { padding: 18px; }
  .options { grid-template-columns: 1fr; }
  .question { font-size: 1.2rem; }
}
</style>
</head>

<body>
<main>

<h1>🇬🇧 Irregular Verbs Trainer</h1>
<p class="sub">
  Dani · 2.º ESO · Verbos irregulares 1–15
</p>

<section id="quiz">
  <div class="top">
    <strong id="mode">Test principal</strong>

    <span>
      Pregunta <b id="number">1</b> /
      <b id="total">40</b>
    </span>

    <span class="stats">
      <span class="green">
        ✓ <span id="right">0</span>
      </span>
      <span class="red">
        ✗ <span id="wrong">0</span>
      </span>
    </span>
  </div>

  <div class="progress">
    <div id="bar" class="bar"></div>
  </div>

  <p id="question" class="question"></p>
  <div id="options" class="options"></div>

  <div id="feedback"
       class="feedback hidden"
       aria-live="polite"></div>

  <button id="next" class="action hidden">
    Siguiente pregunta →
  </button>
</section>

<section id="results" class="hidden">

  <h2 id="headline"></h2>
  <h2 id="score"></h2>
  <p id="assessment"></p>

  <div id="mistakesBox" class="hidden">
    <h3>Verbos que hay que repasar</h3>

    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>Infinitivo</th>
            <th>Past Simple</th>
            <th>Participio</th>
            <th>Español</th>
          </tr>
        </thead>
        <tbody id="mistakesBody"></tbody>
      </table>
    </div>

    <button id="review" class="action">
      Repasar preguntas falladas
    </button>
  </div>

  <button id="restart" class="action">
    Nuevo test de 40 preguntas
  </button>

</section>

</main>

<script>
'use strict';

// =====================================
// VERBOS IRREGULARES DEL 1 AL 15
// =====================================

const VERBS = [
  ['be','was / were','been','ser / estar'],
  ['become','became','become','convertirse en'],
  ['begin','began','begun','empezar'],
  ['break','broke','broken','romper'],
  ['bring','brought','brought','traer'],
  ['build','built','built','construir'],
  ['burn','burnt / burned','burnt / burned','quemar'],
  ['buy','bought','bought','comprar'],
  ['catch','caught','caught','coger'],
  ['choose','chose','chosen','elegir'],
  ['come','came','come','venir'],
  ['cost','cost','cost','costar'],
  ['cut','cut','cut','cortar'],
  ['do','did','done','hacer'],
  ['draw','drew','drawn','dibujar']
].map(([base,past,part,es]) => ({
  base, past, part, es
}));

// =====================================
// TIPOS DE PREGUNTAS
// =====================================

const TYPES = [
  {
    key: 'past',
    prompt: v =>
      `¿Cuál es el Past Simple de «${v.base}»?`
  },
  {
    key: 'part',
    prompt: v =>
      `¿Cuál es el Past Participle de «${v.base}»?`
  },
  {
    key: 'base',
    prompt: v =>
      `¿Cuál es el infinitivo de «${v.es}»?`
  },
  {
    key: 'es',
    prompt: v =>
      `¿Qué significa «${v.base}»?`
  }
];

const $ = id => document.getElementById(id);

function shuffle(items) {
  const a = [...items];

  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }

  return a;
}

// Banco: 15 verbos x 4 tipos de pregunta.
const BANK = VERBS.flatMap((verb, i) =>
  TYPES.map((type, j) => ({
    verb,
    type,
    id: `${i}-${j}`
  }))
);

let questions = [];
let index = 0;
let correct = 0;
let incorrect = 0;
let errors = [];
let answered = false;
let reviewMode = false;

// =====================================
// GENERACIÓN DE LAS CUATRO OPCIONES
// =====================================

function optionSet(q) {
  const {verb, type} = q;
  const answer = verb[type.key];

  let distractors;

  if (type.key === 'es') {

    // Traducciones: cuatro opciones en español.
    distractors = shuffle(
      VERBS
        .filter(v => v !== verb)
        .map(v => v.es)
    );

  } else {

    // PRIORIDAD 1:
    // Todas las otras formas del MISMO verbo.
    const sameVerb = [
      verb.base,
      verb.past,
      verb.part
    ].filter(x => x !== answer);

    // PRIORIDAD 2:
    // Si faltan alternativas, usar otros verbos.
    const otherVerbs = shuffle(
      VERBS
        .filter(v => v !== verb)
        .flatMap(v => [
          v.base,
          v.past,
          v.part
        ])
    );

    distractors = [
      ...sameVerb,
      ...otherVerbs
    ];
  }

  // Quitar repeticiones.
  const unique = [
    ...new Set(distractors)
  ].filter(x => x !== answer);

  // Respuesta correcta + 3 alternativas.
  // Mezclar sus posiciones.
  return shuffle([
    answer,
    ...unique.slice(0, 3)
  ]);
}

// =====================================
// INICIAR TEST
// =====================================

function start(review = false) {
  reviewMode = review;

  questions = review
    ? shuffle(errors)
    : shuffle(BANK).slice(0, 40);

  errors = [];
  index = 0;
  correct = 0;
  incorrect = 0;

  $('mode').textContent = review
    ? 'Repaso de errores'
    : 'Test principal';

  $('total').textContent = questions.length;

  $('quiz').classList.remove('hidden');
  $('results').classList.add('hidden');

  render();
}

// =====================================
// MOSTRAR PREGUNTA
// =====================================

function render() {
  answered = false;

  const q = questions[index];

  $('number').textContent = index + 1;
  $('right').textContent = correct;
  $('wrong').textContent = incorrect;

  $('bar').style.width =
    `${index / questions.length * 100}%`;

  $('question').textContent =
    q.type.prompt(q.verb);

  $('next').classList.add('hidden');
  $('feedback').classList.add('hidden');
  $('options').replaceChildren();

  const answer = q.verb[q.type.key];

  optionSet(q).forEach(value => {
    const b = document.createElement('button');

    b.className = 'option';
    b.textContent = value;

    b.onclick = () =>
      choose(b, value, answer, q);

    $('options').appendChild(b);
  });
}

// =====================================
// CORREGIR RESPUESTA
// =====================================

function choose(button, value, answer, q) {
  if (answered) return;

  answered = true;

  if (value === answer) {
    correct++;
  } else {
    incorrect++;
    errors.push(q);
  }

  for (const b of $('options').children) {
    b.disabled = true;

    if (b.textContent === answer) {
      b.classList.add('correct');
    }
  }

  if (value !== answer) {
    button.classList.add('wrong');
  }

  $('right').textContent = correct;
  $('wrong').textContent = incorrect;

  $('bar').style.width =
    `${(index + 1) / questions.length * 100}%`;

  const v = q.verb;

  $('feedback').textContent =
    (value === answer
      ? '✅ ¡Correcto!'
      : '❌ Respuesta correcta: ' + answer
    ) +
    ` · ${v.base} — ${v.past} — ${v.part} — ${v.es}`;

  $('feedback').classList.remove('hidden');

  $('next').textContent =
    index === questions.length - 1
      ? 'Ver resultados →'
      : 'Siguiente pregunta →';

  $('next').classList.remove('hidden');
}

// =====================================
// RESULTADOS
// =====================================

function showResults() {
  $('quiz').classList.add('hidden');
  $('results').classList.remove('hidden');

  const percentage = Math.round(
    100 * correct / questions.length
  );

  $('headline').textContent =
    percentage >= 85
      ? '🏆 ¡Muy bien, Dani!'
      : '📚 ¡Sigue practicando, Dani!';

  $('score').textContent =
    `${correct} / ${questions.length} · ${percentage}%`;

  $('assessment').textContent =
    percentage >= 85
      ? 'Objetivo del 85 % superado.'
      : 'Objetivo: alcanzar el 85 %.';

  // Mostrar la tabla SOLO si hay errores.
  $('mistakesBox').classList.toggle(
    'hidden',
    errors.length === 0
  );

  $('mistakesBody').replaceChildren();

  // Mostrar cada verbo fallado una sola vez.
  const unique = [
    ...new Map(
      errors.map(q => [q.verb.base, q.verb])
    ).values()
  ];

  unique.forEach(v => {
    const row = document.createElement('tr');

    [v.base, v.past, v.part, v.es].forEach(value => {
      const cell = document.createElement('td');

      cell.textContent = value;
      row.appendChild(cell);
    });

    $('mistakesBody').appendChild(row);
  });
}

// =====================================
// BOTONES
// =====================================

$('next').onclick = () => {
  index++;

  if (index < questions.length) {
    render();
  } else {
    showResults();
  }
};

$('restart').onclick = () => start(false);
$('review').onclick = () => start(true);

// =====================================
// INICIO AUTOMÁTICO
// =====================================

start();

</script>
</body>
</html>
