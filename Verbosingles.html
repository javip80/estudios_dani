
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dani - Irregular Verbs Trainer</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #eef3f8;
  color: #233345;
  font-family: Segoe UI, Arial, sans-serif;
}

.container {
  max-width: 950px;
  margin: auto;
  background: white;
  padding: 28px;
  border-radius: 18px;
  box-shadow: 0 5px 20px #0001;
}

h1 { color: #1f6fb2; margin-top: 0; }
.subtitle { color: #64748b; }

.hidden { display: none !important; }

.menu-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 25px;
}

.menu-btn {
  background: #f5f9fd;
  border: 2px solid #c6dced;
  border-radius: 12px;
  padding: 20px;
  text-align: left;
  cursor: pointer;
  color: #233345;
}

.menu-btn:hover {
  border-color: #1f6fb2;
  background: #eaf4fc;
}

.menu-btn strong {
  display: block;
  font-size: 1.12rem;
  color: #1f6fb2;
  margin-bottom: 8px;
}

.menu-btn span {
  display: block;
  margin: 4px 0;
  font-size: .9rem;
}

.menu-btn.all {
  background: #eaf4fc;
  border-color: #1f6fb2;
}

.top {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}

.stats {
  display: flex;
  gap: 20px;
  font-weight: bold;
}

.good { color: #18854a; }
.bad { color: #bd3434; }

.progress {
  height: 15px;
  background: #dfe6ee;
  border-radius: 20px;
  overflow: hidden;
  margin: 24px 0;
}

.bar {
  height: 100%;
  width: 0;
  background: #1f6fb2;
  transition: width .2s;
}

.question {
  font-size: 1.45rem;
  font-weight: bold;
  margin: 25px 0;
  min-height: 70px;
}

.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

button {
  font: inherit;
  font-weight: 650;
  cursor: pointer;
  padding: 16px;
  border-radius: 10px;
}

.option {
  min-height: 65px;
  background: white;
  border: 2px solid #1f6fb2;
  color: #1f6fb2;
}

.option:hover:not(:disabled) {
  background: #edf6ff;
}

.option.correct {
  background: #18854a;
  color: white;
  border-color: #18854a;
}

.option.wrong {
  background: #bd3434;
  color: white;
  border-color: #bd3434;
}

.option:disabled { cursor: default; }

.action {
  display: block;
  width: 100%;
  margin-top: 20px;
  background: #233345;
  color: white;
  border: none;
}

.action:hover { background: #34506b; }

.feedback {
  background: #f0f5fa;
  border-radius: 10px;
  padding: 15px;
  margin-top: 20px;
  line-height: 1.6;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin: 15px 0;
}

th, td {
  text-align: left;
  padding: 10px;
  border-bottom: 1px solid #dae2e9;
  white-space: nowrap;
}

th { background: #e9f2fb; }

@media(max-width:650px) {
  body { padding: 10px; }
  .container { padding: 18px; }
  .menu-grid, .options {
    grid-template-columns: 1fr;
  }
  .question { font-size: 1.2rem; }
}
</style>
</head>

<body>
<main class="container">

<h1>🇬🇧 Irregular Verbs Trainer</h1>
<p class="subtitle">Dani · 2.º ESO</p>

<!-- MENÚ INICIAL -->
<section id="menu">
  <h2>Selecciona los verbos que quieres practicar</h2>

  <div class="menu-grid" id="menuGrid"></div>

  <p class="subtitle">
    Cada test contiene 40 preguntas aleatorias
    con cuatro respuestas posibles.
  </p>
</section>

<!-- TEST -->
<section id="quiz" class="hidden">

  <div class="top">
    <strong id="mode"></strong>

    <span>
      Pregunta
      <b id="number">1</b> /
      <b id="total">40</b>
    </span>

    <div class="stats">
      <span class="good">✓ <span id="right">0</span></span>
      <span class="bad">✗ <span id="wrong">0</span></span>
    </div>
  </div>

  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>

  <div class="question" id="question"></div>

  <div class="options" id="options"></div>

  <div class="feedback hidden" id="feedback"></div>

  <button id="next" class="action hidden">
    Siguiente pregunta →
  </button>

  <button id="backMenu" class="action">
    Volver al menú
  </button>
</section>

<!-- RESULTADOS -->
<section id="results" class="hidden">

  <h2 id="headline"></h2>
  <h2 id="score"></h2>
  <p id="assessment"></p>

  <div id="mistakesBox" class="hidden">
    <h3>Verbos que hay que repasar</h3>

    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>Infinitivo</th>
            <th>Past Simple</th>
            <th>Past Participle</th>
            <th>Español</th>
          </tr>
        </thead>
        <tbody id="mistakesBody"></tbody>
      </table>
    </div>

    <button id="review" class="action">
      Repasar preguntas falladas
    </button>
  </div>

  <button id="restart" class="action">
    Nuevo test del mismo bloque
  </button>

  <button id="menuButton" class="action">
    Volver al menú principal
  </button>
</section>

</main>

<script>
"use strict";

// =====================================
// 72 VERBOS IRREGULARES
// Orden original de la profesora
// =====================================

const RAW = [
  ["be","was / were","been","ser / estar"],
  ["become","became","become","convertirse en"],
  ["begin","began","begun","empezar"],
  ["break","broke","broken","romper"],
  ["bring","brought","brought","traer"],
  ["build","built","built","construir"],
  ["burn","burnt / burned","burnt / burned","quemar"],
  ["buy","bought","bought","comprar"],
  ["catch","caught","caught","coger"],
  ["choose","chose","chosen","elegir"],
  ["come","came","come","venir"],
  ["cost","cost","cost","costar"],
  ["cut","cut","cut","cortar"],
  ["do","did","done","hacer"],
  ["draw","drew","drawn","dibujar"],

  ["dream","dreamt / dreamed","dreamt / dreamed","soñar"],
  ["drink","drank","drunk","beber"],
  ["drive","drove","driven","conducir"],
  ["eat","ate","eaten","comer"],
  ["fall","fell","fallen","caer(se)"],
  ["feel","felt","felt","sentir(se)"],
  ["fight","fought","fought","luchar / pelear"],
  ["find","found","found","encontrar"],
  ["fly","flew","flown","volar"],
  ["forget","forgot","forgotten","olvidar"],
  ["forgive","forgave","forgiven","perdonar"],
  ["get","got","got","conseguir"],
  ["give","gave","given","dar"],
  ["go","went","gone","ir"],
  ["have","had","had","tener"],

  ["hear","heard","heard","oír"],
  ["hide","hid","hidden","esconder"],
  ["hit","hit","hit","golpear"],
  ["hold","held","held","sujetar"],
  ["hurt","hurt","hurt","dañar / hacer daño"],
  ["keep","kept","kept","guardar / mantener"],
  ["know","knew","known","saber"],
  ["learn","learnt / learned","learnt / learned","aprender"],
  ["leave","left","left","abandonar / irse"],
  ["let","let","let","dejar"],
  ["lose","lost","lost","perder"],
  ["make","made","made","hacer"],
  ["meet","met","met","conocer / quedar con"],
  ["pay","paid","paid","pagar"],
  ["put","put","put","poner"],

  ["read","read","read","leer"],
  ["ride","rode","ridden","montar en"],
  ["ring","rang","rung","sonar"],
  ["run","ran","run","correr"],
  ["say","said","said","decir"],
  ["see","saw","seen","ver"],
  ["sell","sold","sold","vender"],
  ["send","sent","sent","enviar"],
  ["shut","shut","shut","cerrar"],
  ["sing","sang","sung","cantar"],
  ["sit","sat","sat","sentarse"],
  ["sleep","slept","slept","dormir"],
  ["speak","spoke","spoken","hablar"],
  ["spend","spent","spent","gastar"],
  ["stand","stood","stood","permanecer"],

  ["steal","stole","stolen","robar"],
  ["swim","swam","swum","nadar"],
  ["take","took","taken","coger"],
  ["teach","taught","taught","enseñar"],
  ["tell","told","told","contar"],
  ["think","thought","thought","pensar"],
  ["throw","threw","thrown","lanzar"],
  ["understand","understood","understood","entender"],
  ["wake up","woke up","woken up","despertar(se)"],
  ["wear","wore","worn","llevar puesto"],
  ["win","won","won","ganar"],
  ["write","wrote","written","escribir"]
];

const VERBS = RAW.map(([base,past,part,es],i) => ({
  id:i+1,
  base,
  past,
  part,
  es
}));

// =====================================
// BLOQUES Y FECHAS
// =====================================

const GROUPS = [
  {
    label:"Verbos 1–15",
    from:1,
    to:15,
    date:"Miércoles 28/10",
    description:"be → draw"
  },
  {
    label:"Verbos 16–30",
    from:16,
    to:30,
    date:"Martes 3/11",
    description:"dream → have"
  },
  {
    label:"Verbos 31–45",
    from:31,
    to:45,
    date:"Viernes 6/11",
    description:"hear → put"
  },
  {
    label:"Verbos 46–60",
    from:46,
    to:60,
    date:"Martes 10/11",
    description:"read → stand"
  },
  {
    label:"Verbos 61–72",
    from:61,
    to:72,
    date:"Viernes 13/11",
    description:"steal → write"
  },
  {
    label:"Todos los verbos",
    from:1,
    to:72,
    date:"Repaso general",
    description:"Los 72 verbos"
  }
];

const $ = id => document.getElementById(id);

function shuffle(items) {
  const a = [...items];

  for(let i=a.length-1;i>0;i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }

  return a;
}

// =====================================
// TIPOS DE PREGUNTAS
// =====================================

const TYPES = [
  {
    key:"past",
    prompt:v=>
      `¿Cuál es el Past Simple de «${v.base}»?`
  },
  {
    key:"part",
    prompt:v=>
      `¿Cuál es el Past Participle de «${v.base}»?`
  },
  {
    key:"base",
    prompt:v=>
      `¿Cuál es el infinitivo de «${v.es}»?`
  },
  {
    key:"es",
    prompt:v=>
      `¿Qué significa «${v.base}»?`
  }
];

// =====================================
// ESTADO
// =====================================

let activeGroup = null;
let activeVerbs = [];
let questions = [];
let index = 0;
let correct = 0;
let incorrect = 0;
let errors = [];
let answered = false;
let reviewMode = false;

// =====================================
// MENÚ INICIAL
// =====================================

function buildMenu() {
  const grid = $("menuGrid");
  grid.replaceChildren();

  GROUPS.forEach((group,i) => {
    const button = document.createElement("button");
    button.className =
      "menu-btn" + (i===5 ? " all" : "");

    button.innerHTML = `
      <strong>${group.label}</strong>
      <span>${group.description}</span>
      <span>📅 ${group.date}</span>
    `;

    button.onclick = () => selectGroup(i);

    grid.appendChild(button);
  });
}

function showMenu() {
  $("menu").classList.remove("hidden");
  $("quiz").classList.add("hidden");
  $("results").classList.add("hidden");
}

function selectGroup(i) {
  activeGroup = GROUPS[i];

  activeVerbs = VERBS.filter(v =>
    v.id >= activeGroup.from &&
    v.id <= activeGroup.to
  );

  startTest();
}

// =====================================
// GENERAR PREGUNTAS
// =====================================

function createBank() {
  const bank = [];

  activeVerbs.forEach(v => {
    TYPES.forEach(type => {
      // Evitar preguntas ambiguas si dos
      // verbos comparten traducción.
      if(type.key==="base") {
        const sameMeaning = activeVerbs.filter(
          other => other.es===v.es
        );
        if(sameMeaning.length>1) return;
      }

      bank.push({
        verb:v,
        type,
        id:`${v.id}-${type.key}`
      });
    });
  });

  return bank;
}

// =====================================
// OPCIONES DE RESPUESTA
// =====================================

function optionSet(q) {
  const v = q.verb;
  const field = q.type.key;
  const answer = v[field];

  let distractors = [];

  if(field==="es") {

    // Traducción: respuestas en español.
    distractors = shuffle(
      activeVerbs
        .filter(other=>other.id!==v.id)
        .map(other=>other.es)
    );

  } else {

    // Primero, las otras formas del
    // mismo verbo, con máxima prioridad.
    const sameVerb = [
      v.base,
      v.past,
      v.part
    ].filter(value=>value!==answer);

    // Si faltan alternativas,
    // añadir formas de otros verbos.
    const otherVerbs = shuffle(
      activeVerbs
        .filter(other=>other.id!==v.id)
        .flatMap(other=>[
          other.base,
          other.past,
          other.part
        ])
    );

    distractors = [
      ...sameVerb,
      ...otherVerbs
    ];
  }

  const unique = [
    ...new Set(distractors)
  ].filter(x=>x!==answer);

  return shuffle([
    answer,
    ...unique.slice(0,3)
  ]);
}

// =====================================
// INICIAR TEST
// =====================================

function startTest(review=false) {
  reviewMode = review;

  if(review) {
    questions = shuffle(errors);
  } else {
    const bank = createBank();

    // Se permiten nuevos tipos de
    // preguntas si el banco fuera menor
    // de 40, pero nunca repetimos la
    // misma pregunta en una sesión.
    questions = shuffle(bank).slice(0,40);
  }

  errors = [];
  index = 0;
  correct = 0;
  incorrect = 0;
  answered = false;

  $("menu").classList.add("hidden");
  $("results").classList.add("hidden");
  $("quiz").classList.remove("hidden");

  $("mode").textContent =
    activeGroup.label +
    (review ? " · Repaso" : "");

  $("total").textContent =
    questions.length;

  render();
}

// =====================================
// MOSTRAR PREGUNTA
// =====================================

function render() {
  answered = false;

  const q = questions[index];
  const answer = q.verb[q.type.key];

  $("number").textContent = index+1;
  $("right").textContent = correct;
  $("wrong").textContent = incorrect;

  $("bar").style.width =
    `${index/questions.length*100}%`;

  $("question").textContent =
    q.type.prompt(q.verb);

  $("options").replaceChildren();
  $("feedback").classList.add("hidden");
  $("next").classList.add("hidden");

  optionSet(q).forEach(value=>{
    const button = document.createElement("button");

    button.className = "option";
    button.textContent = value;

    button.onclick = () =>
      choose(button,value,answer,q);

    $("options").appendChild(button);
  });
}

// =====================================
// CORREGIR RESPUESTA
// =====================================

function choose(button,value,answer,q) {
  if(answered) return;

  answered = true;

  if(value===answer) {
    correct++;
  } else {
    incorrect++;
    errors.push(q);
  }

  for(const b of $("options").children) {
    b.disabled = true;

    if(b.textContent===answer) {
      b.classList.add("correct");
    }
  }

  if(value!==answer) {
    button.classList.add("wrong");
  }

  $("right").textContent = correct;
  $("wrong").textContent = incorrect;

  $("bar").style.width =
    `${(index+1)/questions.length*100}%`;

  const v = q.verb;

  $("feedback").textContent =
    (value===answer
      ? "✅ ¡Correcto!"
      : "❌ Respuesta correcta: "+answer
    ) +
    ` · ${v.base} — ${v.past} — ${v.part} — ${v.es}`;

  $("feedback").classList.remove("hidden");

  $("next").textContent =
    index===questions.length-1
      ? "Ver resultados →"
      : "Siguiente pregunta →";

  $("next").classList.remove("hidden");
}

// =====================================
// RESULTADOS
// =====================================

function showResults() {
  $("quiz").classList.add("hidden");
  $("results").classList.remove("hidden");

  const percentage = Math.round(
    correct/questions.length*100
  );

  $("headline").textContent =
    percentage>=85
      ? "🏆 ¡Muy bien, Dani!"
      : "📚 ¡Sigue practicando, Dani!";

  $("score").textContent =
    `${correct} / ${questions.length} · ${percentage}%`;

  $("assessment").textContent =
    percentage>=85
      ? "Objetivo del 85 % superado."
      : "Objetivo: alcanzar el 85 %.";

  $("mistakesBox").classList.toggle(
    "hidden",
    errors.length===0
  );

  $("mistakesBody").replaceChildren();

  // Un verbo aparece una sola vez.
  const unique = [
    ...new Map(
      errors.map(q=>[q.verb.id,q.verb])
    ).values()
  ];

  unique.forEach(v=>{
    const row = document.createElement("tr");

    [v.base,v.past,v.part,v.es].forEach(value=>{
      const cell = document.createElement("td");
      cell.textContent = value;
      row.appendChild(cell);
    });

    $("mistakesBody").appendChild(row);
  });
}

// =====================================
// BOTONES
// =====================================

$("next").onclick = ()=>{
  index++;

  if(index<questions.length) {
    render();
  } else {
    showResults();
  }
};

$("restart").onclick = ()=>startTest(false);
$("review").onclick = ()=>startTest(true);
$("backMenu").onclick = showMenu;
$("menuButton").onclick = showMenu;

// =====================================
// INICIO
// =====================================

buildMenu();
showMenu();

</script>
</body>
</html>
