
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dani - Irregular Verbs Trainer</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  font-family: Segoe UI, Arial, sans-serif;
  background: #eef3f8;
  color: #2c3e50;
}
.container {
  max-width: 900px;
  margin: auto;
  padding: 30px;
  background: white;
  border-radius: 18px;
  box-shadow: 0 5px 20px #0001;
}
h1 { color: #1f6fb2; margin-top: 0; }
.subtitle { color: #64748b; }
.top {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}
.stats { display: flex; gap: 20px; font-weight: bold; }
.good { color: #18854a; }
.bad { color: #bd3434; }
.progress {
  height: 15px;
  background: #dfe6ee;
  border-radius: 20px;
  overflow: hidden;
  margin: 24px 0;
}
.bar {
  width: 0;
  height: 100%;
  background: #1f6fb2;
  transition: width .2s;
}
.question {
  font-size: 1.45rem;
  font-weight: bold;
  margin: 25px 0;
}
.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
button {
  font: inherit;
  cursor: pointer;
  padding: 17px;
  border-radius: 10px;
  font-weight: bold;
}
.option {
  background: white;
  color: #1f6fb2;
  border: 2px solid #1f6fb2;
  min-height: 65px;
}
.option:hover:not(:disabled) { background: #edf6ff; }
.option:disabled { cursor: default; }
.option.correct {
  background: #18854a;
  color: white;
  border-color: #18854a;
}
.option.incorrect {
  background: #bd3434;
  color: white;
  border-color: #bd3434;
}
.action {
  display: block;
  width: 100%;
  margin-top: 24px;
  border: none;
  background: #2c3e50;
  color: white;
}
.feedback {
  margin-top: 20px;
  padding: 16px;
  background: #edf3fa;
  border-radius: 10px;
}
.hidden { display: none; }
li { margin-bottom: 12px; }
@media(max-width:600px) {
  .container { padding: 18px; }
  .options { grid-template-columns: 1fr; }
  .question { font-size: 1.2rem; }
}
</style>
</head>

<body>
<div class="container">

<h1>🇬🇧 Irregular Verbs Trainer</h1>
<p class="subtitle">Dani · 2.º ESO · Verbos 1 al 15</p>

<section id="quiz">
  <div class="top">
    <strong id="mode">Test principal</strong>
    <span>Pregunta <b id="index">1</b> / <b id="total">40</b></span>
    <div class="stats">
      <span class="good">✅ <span id="right">0</span></span>
      <span class="bad">❌ <span id="wrong">0</span></span>
    </div>
  </div>

  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="question" id="question"></div>
  <div class="options" id="options"></div>
  <div id="feedback" class="feedback hidden"></div>
  <button id="next" class="action hidden">Siguiente pregunta →</button>
</section>

<section id="results" class="hidden">
  <h2 id="result-title"></h2>
  <h2 id="score"></h2>
  <p id="percentage"></p>
  <div id="review-section" class="hidden">
    <h3>Verbos para repasar</h3>
    <ul id="mistakes"></ul>
    <button id="review" class="action">Repasar errores</button>
  </div>
  <button id="restart" class="action">Nuevo test de 40 preguntas</button>
</section>

<details style="margin-top:30px">
  <summary><strong>Consultar los 15 verbos</strong></summary>
  <div id="verb-list" style="overflow-x:auto"></div>
</details>

</div>

<script>
const VERBS = [
  ["be", "was/were", "been", "ser/estar"],
  ["become", "became", "become", "convertirse en"],
  ["begin", "began", "begun", "empezar"],
  ["break", "broke", "broken", "romper"],
  ["bring", "brought", "brought", "traer"],
  ["build", "built", "built", "construir"],
  ["burn", "burnt/burned", "burnt/burned", "quemar"],
  ["buy", "bought", "bought", "comprar"],
  ["catch", "caught", "caught", "coger"],
  ["choose", "chose", "chosen", "elegir"],
  ["come", "came", "come", "venir"],
  ["cost", "cost", "cost", "costar"],
  ["cut", "cut", "cut", "cortar"],
  ["do", "did", "done", "hacer"],
  ["draw", "drew", "drawn", "dibujar"]
];

const LIMIT = 40;
const PASS = 85;
const $ = id => document.getElementById(id);

let questions = [];
let index = 0;
let right = 0;
let wrong = 0;
let mistakes = [];
let reviewMode = false;

function shuffle(items) {
  const a = [...items];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function makeQuestion(verb, type) {
  const [base, past, participle, spanish] = verb;

  const types = [
    {
      question: `¿Qué significa "${base}"?`,
      answer: spanish,
      field: 3
    },
    {
      question: `¿Cuál es el infinitivo de "${spanish}"?`,
      answer: base,
      field: 0
    },
    {
      question: `¿Cuál es el Past Simple de "${base}"?`,
      answer: past,
      field: 1
    },
    {
      question: `¿Cuál es el Past Participle de "${base}"?`,
      answer: participle,
      field: 2
    }
  ];

  const selected = types[type];
  const alternatives = shuffle(
    [...new Set(VERBS.map(v => v[selected.field]))]
      .filter(a => a !== selected.answer)
  ).slice(0, 3);

  return {
    verb,
    type,
    question: selected.question,
    answer: selected.answer,
    options: shuffle([selected.answer, ...alternatives])
  };
}

function startTest() {
  const combinations = [];
  VERBS.forEach(v => {
    for (let type = 0; type < 4; type++) {
      combinations.push({verb: v, type});
    }
  });

  questions = shuffle(combinations)
    .slice(0, LIMIT)
    .map(q => makeQuestion(q.verb, q.type));

  reviewMode = false;
  reset();
}

function startReview() {
  questions = shuffle(mistakes)
    .map(q => makeQuestion(q.verb, q.type));
  reviewMode = true;
  reset();
}

function reset() {
  index = 0;
  right = 0;
  wrong = 0;
  if (!reviewMode) mistakes = [];

  $("quiz").classList.remove("hidden");
  $("results").classList.add("hidden");
  $("total").textContent = questions.length;
  $("mode").textContent = reviewMode ? "Repaso de errores" : "Test principal";
  render();
}

function render() {
  const q = questions[index];
  $("index").textContent = index + 1;
  $("right").textContent = right;
  $("wrong").textContent = wrong;
  $("bar").style.width = `${index / questions.length * 100}%`;
  $("question").textContent = q.question;
  $("feedback").classList.add("hidden");
  $("next").classList.add("hidden");
  $("options").innerHTML = "";

  q.options.forEach(option => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = option;
    btn.onclick = () => answer(option);
    $("options").appendChild(btn);
  });
}

function answer(selected) {
  const q = questions[index];
  const correct = selected === q.answer;

  if (correct) {
    right++;
  } else {
    wrong++;
    mistakes.push(q);
  }

  document.querySelectorAll(".option").forEach(btn => {
    btn.disabled = true;
    if (btn.textContent === q.answer) {
      btn.classList.add("correct");
    } else if (btn.textContent === selected) {
      btn.classList.add("incorrect");
    }
  });

  $("right").textContent = right;
  $("wrong").textContent = wrong;
  $("bar").style.width = `${(index + 1) / questions.length * 100}%`;

  const v = q.verb;
  $("feedback").textContent =
    `${correct ? "✅ ¡Correcto!" : "❌ Respuesta correcta: " + q.answer}
    | ${v[0]} - ${v[1]} - ${v[2]} - ${v[3]}`;

  $("feedback").classList.remove("hidden");
  $("next").classList.remove("hidden");
}

function nextQuestion() {
  index++;
  if (index < questions.length) render();
  else showResults();
}

function showResults() {
  $("quiz").classList.add("hidden");
  $("results").classList.remove("hidden");

  const percent = Math.round(right / questions.length * 100);
  $("result-title").textContent =
    percent >= PASS ? "🏆 ¡Excelente trabajo!" : "📚 ¡Sigue practicando!";
  $("score").textContent = `${right} / ${questions.length}`;
  $("percentage").textContent = `Aciertos: ${percent}%`;

  const reviewSection = $("review-section");
  reviewSection.classList.toggle("hidden", mistakes.length === 0);

  $("mistakes").innerHTML = "";
  mistakes.forEach(q => {
    const li = document.createElement("li");
    li.textContent =
      `${q.question} → ${q.answer} (${q.verb.join(" / ")})`;
    $("mistakes").appendChild(li);
  });
}

function buildTable() {
  const table = document.createElement("table");
  table.style.cssText =
    "width:100%;border-collapse:collapse;margin-top:15px;font-size:.9rem";

  const rows = [
    ["Infinitivo", "Past Simple", "Participio", "Español"],
    ...VERBS
  ];

  rows.forEach((r, i) => {
    const tr = document.createElement("tr");
    r.forEach(value => {
      const cell = document.createElement(i === 0 ? "th" : "td");
      cell.textContent = value;
      cell.style.cssText =
        "padding:9px;border:1px solid #dfe6ee;text-align:left";
      if (i === 0) cell.style.background = "#e9f2fb";
      tr.appendChild(cell);
    });
    table.appendChild(tr);
  });
  $("verb-list").appendChild(table);
}

$("next").onclick = nextQuestion;
$("restart").onclick = startTest;
$("review").onclick = startReview;

buildTable();
startTest();
</script>
</body>
</html>
