h1{
  margin-top:0;

}

.top-bar{
  display:flex;
  justify-content:space-between;

  flex-wrap:wrap;
  gap:10px;

}

.stats{
  display:flex;

.correct{

}

.wrong{

}

.progress-wrapper{
  width:100%;

  height:100%;

.question{

  font-weight:bold;
  margin:30px 0;

}

.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

button{
  border:none;
  border-radius:10px;
  padding:16px;
  cursor:pointer;
  font-size:1rem;
  transition:0.2s;

.option-btn{

}

.option-btn:hover:not(:disabled){

.option-btn:disabled{

}

.correct-answer{
  background:#1e9b50 !important;

}

.wrong-answer{
  background:#c0392b !important;

}

}

}

.next-btn:hover,

  opacity:0.9;
}

.hidden{
  display:none;
}

.result-title{

}

.success{

}

.fail{

}

.error-list{

}

}

.mode-badge{

  border-radius:999px;
  font-size:0.9rem;

}

@media(max-width:650px){

// =====================================
// STATE
// =====================================

let currentQuestions = [];
let currentIndex = 0;
let correctAnswers = 0;
let wrongAnswers = 0;
let mistakes = [];
let reviewMode = false;

// =====================================
// DOM
// =====================================

const questionText = document.getElementById("question-text");
const optionsContainer = document.getElementById("options-container");
const nextBtn = document.getElementById("next-btn");

const correctCount = document.getElementById("correct-count");
const wrongCount = document.getElementById("wrong-count");

const questionNumber = document.getElementById("question-number");
const questionTotal = document.getElementById("question-total");

const progressBar = document.getElementById("progress-bar");

const quizScreen = document.getElementById("quiz-screen");
const resultScreen = document.getElementById("result-screen");

const resultTitle = document.getElementById("result-title");
const finalScore = document.getElementById("final-score");
const finalPercentage = document.getElementById("final-percentage");

const mistakesSection = document.getElementById("mistakes-section");
const mistakesList = document.getElementById("mistakes-list");

const reviewBtn = document.getElementById("review-btn");
const restartBtn = document.getElementById("restart-btn");

const modeBadge = document.getElementById("mode-badge");

// =====================================
// UTILITIES
// =====================================

function shuffle(array){

  const arr = [...array];

  for(let i = arr.length - 1; i > 0; i--){

    const j = Math.floor(Math.random() * (i + 1));

    [arr[i], arr[j]] = [arr[j], arr[i]];
  }

  return arr;
}

function getRandomDirection(){

  return Math.random() < 0.5
    ? "ES_EN"
    : "EN_ES";
}

function getWrongOptions(correctItem, direction){

  const field =
    direction === "ES_EN"
      ? "en"
      : "es";

  const pool = vocabulary.filter(v =>
    v[field] !== correctItem[field]
  );

  return shuffle(
    [...new Set(pool.map(v => v[field]))]
  ).slice(0,5);
}

// =====================================
// BUILD TESTS
// =====================================

function buildMainTest(){

  const selected =
    shuffle(vocabulary)
      .slice(0, MAIN_TEST_QUESTIONS);

  currentQuestions =
    selected.map(item => ({
      item,
      direction:getRandomDirection()
    }));

  reviewMode = false;
}

function buildReviewTest(){

  currentQuestions =
    shuffle(mistakes).map(item => ({
      item,
      direction:getRandomDirection()
    }));

  reviewMode = true;
}

// =====================================
// QUIZ FLOW
// =====================================

function startMainTest(){

  currentIndex = 0;
  correctAnswers = 0;
  wrongAnswers = 0;
  mistakes = [];

  buildMainTest();

  questionTotal.textContent =
    MAIN_TEST_QUESTIONS;

  showQuizScreen();

  renderQuestion();
}

function startReviewMode(){

  currentIndex = 0;
  correctAnswers = 0;
  wrongAnswers = 0;

  buildReviewTest();

  questionTotal.textContent =
    currentQuestions.length;

  showQuizScreen();

  renderQuestion();
}

function renderQuestion(){

  nextBtn.classList.add("hidden");

  updateStats();

  const current =
    currentQuestions[currentIndex];

  const item =
    current.item;

  const direction =
    current.direction;

  const correct =
    direction === "ES_EN"
      ? item.en
      : item.es;

  const question =
    direction === "ES_EN"
      ? `How do you say "${item.es}" in English?`
      : `What does "${item.en}" mean?`;

  questionText.textContent =
    question;

  questionNumber.textContent =
    currentIndex + 1;

  progressBar.style.width =
    `${(currentIndex / currentQuestions.length) * 100}%`;

  const wrongOptions =
    getWrongOptions(item, direction);

  const options =
    shuffle([correct, ...wrongOptions]);

  optionsContainer.innerHTML = "";

  options.forEach(option => {

    const btn =
      document.createElement("button");

    btn.className = "option-btn";

    btn.textContent = option;

    btn.addEventListener("click", () => {

      const buttons =
        document.querySelectorAll(".option-btn");

      buttons.forEach(b => {

        b.disabled = true;

        if(b.textContent === correct){

          b.classList.add("correct-answer");
        }
      });

      if(option === correct){

        correctAnswers++;

      }else{

        wrongAnswers++;

        btn.classList.add("wrong-answer");

        const field =
          direction === "ES_EN"
            ? "en"
            : "es";

        const clickedItem =
          vocabulary.find(v =>
            v[field] === option
          );

        if(clickedItem){

          const translation =
            direction === "ES_EN"
              ? clickedItem.es
              : clickedItem.en;

          const hint =
            document.createElement("span");

          hint.className = "hint";

          hint.textContent =
            `(Means: ${translation})`;

          btn.appendChild(hint);
        }

        if(!mistakes.includes(item)){

          mistakes.push(item);
        }
      }

      updateStats();

      nextBtn.classList.remove("hidden");
    });

    optionsContainer.appendChild(btn);
  });
}

function nextQuestion(){

  currentIndex++;

  if(currentIndex < currentQuestions.length){

    renderQuestion();

  }else{

    showResults();
  }
}

function showResults(){

  quizScreen.classList.add("hidden");

  resultScreen.classList.remove("hidden");

  const total =
    currentQuestions.length;

  const percentage =
    Math.round((correctAnswers / total) * 100);

  finalScore.textContent =
    `${correctAnswers} / ${total}`;

  finalPercentage.textContent =
    `${percentage}%`;

  if(percentage >= PASS_PERCENTAGE){

    resultTitle.textContent =
      "🏆 Excellent Work!";

    resultTitle.className =
      "result-title success";

  }else{

    resultTitle.textContent =
      "❌ Keep Practising!";

    resultTitle.className =
      "result-title fail";
  }

  if(mistakes.length > 0 && !reviewMode){

    mistakesSection.classList.remove("hidden");

    mistakesList.innerHTML = "";

    mistakes.forEach(word => {

      const li =
        document.createElement("li");

      li.textContent =
        `${word.es} → ${word.en}`;

      mistakesList.appendChild(li);
    });

  }else{

    mistakesSection.classList.add("hidden");
  }
}

function updateStats(){

  correctCount.textContent =
    correctAnswers;

  wrongCount.textContent =
    wrongAnswers;

  modeBadge.textContent =
    reviewMode
      ? "Review Mode"
      : "Main Test";
}

function showQuizScreen(){

  resultScreen.classList.add("hidden");

  quizScreen.classList.remove("hidden");
}

// =====================================
// EVENTS
// =====================================

nextBtn.addEventListener(
  "click",
  nextQuestion
);

restartBtn.addEventListener(
  "click",
  startMainTest
);

reviewBtn.addEventListener(
  "click",
  startReviewMode
);

// =====================================
// START
// =====================================

startMainTest();

</script>
