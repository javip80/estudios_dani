<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Segoe UI, Arial, sans-serif;
    background:#eef3f8;
    color:#2c3e50;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    border-radius:16px;
    padding:30px;
    box-shadow:0 4px 18px rgba(0,0,0,0.1);
}

h1{
    margin-top:0;
    color:#1f6fb2;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.stats{
    display:flex;
    gap:20px;
    font-weight:bold;
}

.correct{
    color:#1e9b50;
}

.wrong{
    color:#c0392b;
}

.progress-wrapper{
    width:100%;
    background:#dfe6ee;
    border-radius:999px;
    overflow:hidden;
    height:18px;
    margin:20px 0;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#1f6fb2;
    transition:0.3s;
}

.question{
    font-size:1.5rem;
    font-weight:bold;
    margin:30px 0;
    min-height:70px;
}

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

button{
    border:none;
    border-radius:10px;
    padding:16px;
    cursor:pointer;
    font-size:1rem;
    transition:0.2s;
}

.option-btn{
    background:white;
    border:2px solid #1f6fb2;
    color:#1f6fb2;
    min-height:70px;
    font-weight:600;
}

.option-btn:hover:not(:disabled){
    background:#1f6fb2;
    color:white;
}

.option-btn:disabled{
    cursor:default;
}

.correct-answer{
    background:#1e9b50 !important;
    border-color:#1e9b50 !important;
    color:white !important;
}

.wrong-answer{
    background:#c0392b !important;
    border-color:#c0392b !important;
    color:white !important;
}

.hint{
    display:block;
    margin-top:6px;
    font-size:0.85rem;
    opacity:0.9;
}

.next-btn,
.restart-btn,
.review-btn{
    margin-top:25px;
    width:100%;
    background:#2c3e50;
    color:white;
    font-weight:bold;
    font-size:1rem;
}

.next-btn:hover,
.restart-btn:hover,
.review-btn:hover{
    opacity:0.9;
}

.hidden{
    display:none;
}

.result-title{
    font-size:2rem;
    margin-bottom:10px;
}

.success{
    color:#1e9b50;
}

.fail{
    color:#c0392b;
}

.error-list{
    text-align:left;
    margin-top:20px;
    background:#f7f9fc;
    padding:15px;
    border-radius:10px;
}

.error-list li{
    margin-bottom:8px;
}

.mode-badge{
    background:#1f6fb2;
    color:white;
    padding:6px 12px;
    border-radius:999px;
    font-size:0.9rem;
    font-weight:bold;
}

@media(max-width:650px){
    .options{
        grid-template-columns:1fr;
    }
    .question{
        font-size:1.25rem;
    }
    .top-bar{
        flex-direction:column;
        align-items:flex-start;
    }
}
</style>
</head>

function shuffle(array){
    const arr = [...array];
    for(let i = arr.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function getRandomDirection(){
    return Math.random() < 0.5 ? "ES_EN" : "EN_ES";
}

// =====================================
// GENERACIÓN DE PREGUNTAS Y LÓGICA DE TEMAS
// =====================================
function buildMainTest(){
    // La magia de las proporciones: 10 de M6, 25 del resto, 5 básicas
    let obligatoriasM6 = shuffle([...vocabM6]).slice(0, 10);
    let obligatoriasM1to5 = shuffle([...vocabM1to5]).slice(0, 25);
    let obligatoriasBasics = shuffle([...vocabBasics]).slice(0, 5);

    let seleccionadas = shuffle([...obligatoriasM6, ...obligatoriasM1to5, ...obligatoriasBasics]);

    currentQuestions = seleccionadas.map(item => ({
        item,
        direction: getRandomDirection()
    }));
    reviewMode = false;
}

function buildReviewTest(){
    currentQuestions = shuffle(mistakes).map(item => ({
        item,
        direction: getRandomDirection()
    }));
    reviewMode = true;
}

function getWrongOptions(correctItem, direction){
    const field = direction === "ES_EN" ? "en" : "es";
    
    // Primero, busca opciones falsas dentro de su misma categoría para que sea más difícil
    let sameCategory = fullVocabulary.filter(v => 
        v.category === correctItem.category && v[field] !== correctItem[field]
    );

    let pool = sameCategory;
    
    // Si no hay suficientes palabras en esa categoría, coge del resto del vocabulario
    if(pool.length < 5){
        pool = fullVocabulary.filter(v => v[field] !== correctItem[field]);
    }

    return shuffle([...new Set(pool.map(v => v[field]))]).slice(0,5);
}

// =====================================
// FLUJO DEL TEST
// =====================================
function startMainTest(){
    currentIndex = 0;
    correctAnswers = 0;
    wrongAnswers = 0;
    mistakes = [];

    buildMainTest();
    questionTotal.textContent = MAIN_TEST_QUESTIONS;
    showQuizScreen();
    renderQuestion();
}

function startReviewMode(){
    currentIndex = 0;
    correctAnswers = 0;
    wrongAnswers = 0;

    buildReviewTest();
    questionTotal.textContent = currentQuestions.length;
    showQuizScreen();
    renderQuestion();
}

function renderQuestion(){
    nextBtn.classList.add("hidden");
    updateStats();

    const current = currentQuestions[currentIndex];
    const item = current.item;
    const direction = current.direction;

    const correct = direction === "ES_EN" ? item.en : item.es;
    const question = direction === "ES_EN" 
        ? `How do you say "${item.es}" in English?` 
        : `What does "${item.en}" mean?`;

    questionText.textContent = question;
    questionNumber.textContent = currentIndex + 1;
    progressBar.style.width = `${((currentIndex) / currentQuestions.length) * 100}%`;

    const wrongOptions = getWrongOptions(item, direction);
    const options = shuffle([correct, ...wrongOptions]);

    optionsContainer.innerHTML = "";

    options.forEach(option => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = option;

        btn.addEventListener("click", () => {
            const buttons = document.querySelectorAll(".option-btn");

            buttons.forEach(b => {
                b.disabled = true;
                if(b.textContent === correct){
                    b.classList.add("correct-answer");
                }
            });

            if(option === correct){
                correctAnswers++;
            }else{
                wrongAnswers++;
                btn.classList.add("wrong-answer");

                const meaning = direction === "ES_EN" ? item.es : item.en;
                const hint = document.createElement("span");
                hint.className = "hint";
                hint.textContent = `Correct: ${meaning}`;
                btn.appendChild(hint);

                if(!mistakes.includes(item)){
                    mistakes.push(item);
                }
            }
            updateStats();
            nextBtn.classList.remove("hidden");
        });
        optionsContainer.appendChild(btn);
    });
}

function nextQuestion(){
    currentIndex++;
    if(currentIndex < currentQuestions.length){
        renderQuestion();
    }else{
        showResults();
    }
}

function showResults(){
    quizScreen.classList.add("hidden");
    resultScreen.classList.remove("hidden");

    const total = currentQuestions.length;
    const percentage = Math.round((correctAnswers / total) * 100);

    finalScore.textContent = `${correctAnswers} / ${total}`;
    finalPercentage.textContent = `${percentage}%`;

    if(percentage >= PASS_PERCENTAGE){
        resultTitle.textContent = "🏆 Excellent Work!";
        resultTitle.className = "result-title success";
    }else{
        resultTitle.textContent = "❌ Keep Practising!";
        resultTitle.className = "result-title fail";
    }

    if(mistakes.length > 0 && !reviewMode){
        mistakesSection.classList.remove("hidden");
        mistakesList.innerHTML = "";
        mistakes.forEach(word => {
            const li = document.createElement("li");
            li.textContent = `${word.es} → ${word.en}`;
            mistakesList.appendChild(li);
        });
    }else{
        mistakesSection.classList.add("hidden");
    }
}

function updateStats(){
    correctCount.textContent = correctAnswers;
    wrongCount.textContent = wrongAnswers;
    modeBadge.textContent = reviewMode ? "Review Mode" : "Main Test";
}

function showQuizScreen(){
    resultScreen.classList.add("hidden");
    quizScreen.classList.remove("hidden");
}

// =====================================
// EVENTOS
// =====================================
nextBtn.addEventListener("click", nextQuestion);
restartBtn.addEventListener("click", startMainTest);
reviewBtn.addEventListener("click", startReviewMode);

// INICIAR TEST
startMainTest();
</script>
