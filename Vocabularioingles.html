<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dani - English Vocabulary Trainer | 2.º ESO</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  font-family:Segoe UI, Arial, sans-serif;
  background:#eef3f8;
  color:#2c3e50;
}

.container{
  max-width:950px;
  margin:auto;
  background:white;
  border-radius:18px;
  padding:30px;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h1{
  margin-top:0;
  color:#1f6fb2;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:20px;
}

.stats{
  display:flex;
  gap:20px;
  font-weight:bold;
}

.correct{
  color:#1e9b50;
}

.wrong{
  color:#c0392b;
}

.progress-wrapper{
  width:100%;
  height:18px;
  background:#dfe6ee;
  border-radius:999px;
  overflow:hidden;
  margin:20px 0;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#1f6fb2;
  transition:0.3s;
}

.question{
  font-size:1.5rem;
  font-weight:bold;
  margin:30px 0;
  min-height:80px;
}

.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

button{
  border:none;
  border-radius:10px;
  padding:16px;
  cursor:pointer;
  font-size:1rem;
  transition:0.2s;
}

.option-btn{
  background:white;
  border:2px solid #1f6fb2;
  color:#1f6fb2;
  min-height:72px;
  font-weight:600;
}

.option-btn:hover:not(:disabled){
  background:#1f6fb2;
  color:white;
}

.option-btn:disabled{
  cursor:default;
}

.correct-answer{
  background:#1e9b50 !important;
  border-color:#1e9b50 !important;
  color:white !important;
}

.wrong-answer{
  background:#c0392b !important;
  border-color:#c0392b !important;
  color:white !important;
}

.hint{
  display:block;
  margin-top:6px;
  font-size:0.85rem;
  opacity:0.9;
}

.next-btn,
.restart-btn,
.review-btn{
  margin-top:25px;
  width:100%;
  background:#2c3e50;
  color:white;
  font-weight:bold;
}

.next-btn:hover,
.restart-btn:hover,
.review-btn:hover{
  opacity:0.9;
}

.hidden{
  display:none;
}

.result-title{
  font-size:2rem;
  margin-bottom:10px;
}

.success{
  color:#1e9b50;
}

.fail{
  color:#c0392b;
}

.error-list{
  text-align:left;
  margin-top:20px;
  background:#f7f9fc;
  padding:15px;
  border-radius:10px;
}

.error-list li{
  margin-bottom:8px;
}

.mode-badge{
  background:#1f6fb2;
  color:white;
  padding:6px 12px;
  border-radius:999px;
  font-size:0.9rem;
  font-weight:bold;
}

@media(max-width:650px){

  .options{
    grid-template-columns:1fr;
  }

  .question{
    font-size:1.25rem;
  }

  .top-bar{
    flex-direction:column;
    align-items:flex-start;
  }
}


/* Mejoras compatibles con la plantilla original */
.subtitle { margin: -4px 0 18px; color: #607387; font-size: .93rem; }
.filters { display: grid; grid-template-columns: 1fr 1fr auto; align-items: end; gap: 12px; margin: 16px 0; padding: 14px; border: 1px solid #dce6f0; border-radius: 12px; background: #f7faff; }
.filter-label { display: flex; flex-direction: column; gap: 5px; font-size: .86rem; font-weight: 700; color: #435a72; }
.filters select { width: 100%; border-radius: 8px; border: 1px solid #b7c8da; padding: 11px 10px; background: white; color: #1a344c; font: inherit; font-size: .94rem; }
.action-btn { background: #1f6fb2; color: white; padding: 11px 16px; font-weight: 700; white-space: nowrap; }
.bank-info { font-size: .84rem; color: #576a7c; margin-top: 8px; }
.question-tag { margin: 8px 0 0; color: #627488; font-size: .84rem; font-weight: 600; }
.option-btn { overflow-wrap: anywhere; line-height: 1.4; padding: 13px; }
.feedback { margin-top: 16px; border-radius: 10px; padding: 12px 14px; background: #eff7fd; color: #24425d; font-size: .96rem; line-height: 1.5; }
.feedback.ok { background: #e9f8ef; color: #146232; }
.feedback.bad { background: #fff0ed; color: #922e26; }
.result-extra { color: #607387; }
.no-mistakes { color: #1e9b50; font-weight: 700; }
.btn-secondary { background: #687b8d; color: #fff; }
button:focus-visible, select:focus-visible { outline: 3px solid #ffae3d; outline-offset: 3px; }
@media(max-width:650px){
  .filters{grid-template-columns:1fr;}
  .action-btn{width:100%;}
  .container{padding:18px;}
  body{padding:10px;}
}

</style>
</head>

  <div id="result-screen" class="hidden">

</div>

const GROUP_NAMES = {intro:'Introduction',m1:'Module 1',m2:'Module 2',extra:'Frases adicionales'};

// ESTADO
// =====================================
let currentQuestions = [];
let currentIndex = 0;
let correctAnswers = 0;
let wrongAnswers = 0;
let mistakes = [];
let reviewMode = false;
let correctAnswerLocked = false;
let activePool = vocabulary;
const byId = id => document.getElementById(id);
const refs = {
  questionText: byId('question-text'), questionTag: byId('question-tag'),
  optionsContainer: byId('options-container'), nextBtn: byId('next-btn'),
  correctCount: byId('correct-count'), wrongCount: byId('wrong-count'),
  questionNumber: byId('question-number'), questionTotal: byId('question-total'),
  progressBar: byId('progress-bar'), quizScreen: byId('quiz-screen'),
  resultScreen: byId('result-screen'), resultTitle: byId('result-title'),
  finalScore: byId('final-score'), finalPercentage: byId('final-percentage'),
  mistakesSection: byId('mistakes-section'), mistakesList: byId('mistakes-list'),
  reviewBtn: byId('review-btn'), restartBtn: byId('restart-btn'),
  modeBadge: byId('mode-badge'), moduleFilter: byId('module-filter'),
  typeFilter: byId('type-filter'), newTestBtn: byId('new-test-btn'),
  bankInfo: byId('bank-info'), feedback: byId('feedback'),
  resultMessage: byId('result-message')
};

function shuffle(values) {
  const result = [...values];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function getPool() {
  const group = refs.moduleFilter.value;
  const kind = refs.typeFilter.value;
  return vocabulary.filter(v =>
    (group === 'all' || v.group === group) &&
    (kind === 'all' || v.kind === kind)
  );
}

function updatePoolCount() {
  const pool = getPool();
  const words = pool.filter(v => v.kind === 'word').length;
  const phrases = pool.length - words;
  refs.bankInfo.textContent = `Banco seleccionado: ${pool.length} entradas (${words} palabras y ${phrases} frases). Cada test muestra 40 preguntas aleatorias. Mínimo para aprobar: ${PASS_PERCENTAGE}%.`;
}

function makeMainTest() {
  activePool = getPool();
  if (!activePool.length) {
    refs.bankInfo.textContent = 'Esta combinación de filtros no tiene preguntas. Selecciona otro contenido.';
    return false;
  }
  // En temarios pequeños, una entrada puede salir una vez por cada dirección,
  // pero nunca se repite exactamente la misma pregunta dentro del test.
  const words = shuffle(activePool.filter(v => v.kind === 'word'));
  const phrases = shuffle(activePool.filter(v => v.kind === 'phrase'));
  // En el test mixto, predominan las palabras: 30 de vocabulario y 10 frases.
  // Si faltan entradas en un tipo, se completa con el otro.
  let chosen = [];
  if (words.length && phrases.length) {
    chosen = [
      ...words.slice(0, 30),
      ...phrases.slice(0, 10)
    ];
    const used = new Set(chosen);
    chosen.push(...shuffle(activePool.filter(v => !used.has(v))).slice(0, MAIN_TEST_QUESTIONS - chosen.length));
  } else {
    chosen = shuffle(activePool).slice(0, MAIN_TEST_QUESTIONS);
  }
  const first = shuffle(chosen).map(item => ({item, direction: Math.random() < .5 ? 'ES_EN' : 'EN_ES'}));
  const second = shuffle(first).map(q => ({item:q.item, direction:q.direction === 'ES_EN' ? 'EN_ES' : 'ES_EN'}));
  currentQuestions = [...first, ...second].slice(0, MAIN_TEST_QUESTIONS);
  return true;
}

function makeReviewTest() {
  const retry = shuffle(mistakes);
  if (!retry.length) return false;
  currentQuestions = retry.map(item => ({item, direction:Math.random() < .5 ? 'ES_EN' : 'EN_ES'}));
  activePool = vocabulary;
  return true;
}

function resetTestState() {
  currentIndex = 0;
  correctAnswers = 0;
  wrongAnswers = 0;
  correctAnswerLocked = false;
  mistakes = [];
  refs.quizScreen.classList.remove('hidden');
  refs.resultScreen.classList.add('hidden');
}

function startMainTest() {
  if (!makeMainTest()) return;
  reviewMode = false;
  resetTestState();
  refs.questionTotal.textContent = currentQuestions.length;
  renderQuestion();
  updatePoolCount();
}

function startReviewTest() {
  const previousMistakes = [...mistakes];
  if (!previousMistakes.length) return;
  reviewMode = true;
  // Se generan las preguntas antes de limpiar los errores del intento anterior.
  makeReviewTest();
  resetTestState();
  refs.questionTotal.textContent = currentQuestions.length;
  renderQuestion();
}

function getDistractors(item, direction) {
  const field = direction === 'ES_EN' ? 'en' : 'es';
  const correct = item[field];
  const seen = new Set([correct.toLocaleLowerCase('es')]);
  const selected = [];
  const all = shuffle(vocabulary);
  // Prioriza respuestas plausibles del mismo ámbito y tipo de pregunta.
  const tiers = [
    v => v.kind === item.kind && v.category === item.category && v.group === item.group,
    v => v.kind === item.kind && v.group === item.group,
    v => v.kind === item.kind,
    v => true
  ];
  for (const condition of tiers) {
    for (const candidate of all) {
      if (selected.length >= 5) break;
      if (!condition(candidate)) continue;
      const value = candidate[field];
      const key = value.toLocaleLowerCase('es');
      if (seen.has(key)) continue;
      selected.push({value, item:candidate});
      seen.add(key);
    }
    if (selected.length === 5) break;
  }
  return selected;
}

function renderQuestion() {
  if (currentIndex >= currentQuestions.length) return showResults();
  refs.nextBtn.classList.add('hidden');
  refs.feedback.className = 'feedback hidden';
  refs.feedback.textContent = '';
  correctAnswerLocked = false;
  updateStats();

  const {item, direction} = currentQuestions[currentIndex];
  const sourceLanguage = direction === 'ES_EN' ? item.es : item.en;
  const correct = direction === 'ES_EN' ? item.en : item.es;
  refs.questionText.textContent = direction === 'ES_EN'
    ? `¿Cómo se dice en inglés «${sourceLanguage}»?`
    : `¿Qué significa «${sourceLanguage}»?`;
  refs.questionTag.textContent = `${GROUP_NAMES[item.group]} · ${item.category} · ${item.kind === 'word' ? 'Vocabulario' : 'Frase'} · ${direction === 'ES_EN' ? 'Español → Inglés' : 'Inglés → Español'}`;
  refs.questionNumber.textContent = currentIndex + 1;
  refs.progressBar.style.width = `${Math.round(100 * currentIndex / currentQuestions.length)}%`;

  const choices = shuffle([
    {value:correct, item, isCorrect:true},
    ...getDistractors(item, direction).map(d => ({...d,isCorrect:false}))
  ]);
  refs.optionsContainer.replaceChildren();
  for (const choice of choices) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'option-btn';
    btn.textContent = choice.value;
    btn.addEventListener('click', () => answerQuestion(choice,btn,choices));
    refs.optionsContainer.appendChild(btn);
  }
}

function answerQuestion(choice, clickedButton, choices) {
  if (correctAnswerLocked) return;
  correctAnswerLocked = true;
  const question = currentQuestions[currentIndex];
  const item = question.item;
  const direction = question.direction;
  const correct = direction === 'ES_EN' ? item.en : item.es;
  const buttons = [...refs.optionsContainer.querySelectorAll('button')];
  buttons.forEach((button,i) => {
    button.disabled = true;
    if (choices[i].isCorrect) button.classList.add('correct-answer');
  });
  if (choice.isCorrect) {
    correctAnswers++;
    refs.feedback.className = 'feedback ok';
    refs.feedback.textContent = `✓ ¡Correcto! ${item.es} → ${item.en}`;
  } else {
    wrongAnswers++;
    clickedButton.classList.add('wrong-answer');
    mistakes.push(item);
    refs.feedback.className = 'feedback bad';
    refs.feedback.textContent = `✗ La respuesta correcta es: ${correct}.  ${item.es} → ${item.en}`;
  }
  refs.nextBtn.classList.remove('hidden');
  refs.nextBtn.textContent = currentIndex === currentQuestions.length - 1 ? 'Ver resultado →' : 'Siguiente pregunta →';
  updateStats();
}

function updateStats() {
  refs.correctCount.textContent = correctAnswers;
  refs.wrongCount.textContent = wrongAnswers;
  refs.modeBadge.textContent = reviewMode ? 'Repaso de errores' : 'Test principal';
}

function showResults() {
  refs.progressBar.style.width = '100%';
  refs.quizScreen.classList.add('hidden');
  refs.resultScreen.classList.remove('hidden');
  const total = currentQuestions.length;
  const percent = Math.round(100 * correctAnswers / total);
  const passed = percent >= PASS_PERCENTAGE;
  refs.finalScore.textContent = `${correctAnswers} / ${total}`;
  refs.finalPercentage.textContent = `${percent}%`;
  refs.resultTitle.textContent = passed ? '🏆 ¡Buen trabajo!' : '📚 Sigue practicando';
  refs.resultTitle.className = `result-title ${passed ? 'success' : 'fail'}`;
  refs.resultMessage.textContent = reviewMode
    ? `Repaso terminado: ${mistakes.length ? 'puedes repetir las que todavía fallas.' : '¡ya has acertado todas las preguntas de este repaso!'}`
    : `Necesitas al menos un ${PASS_PERCENTAGE}% (${Math.ceil(total * PASS_PERCENTAGE / 100)} aciertos de ${total}) para superar el test.`;
  refs.mistakesSection.classList.toggle('hidden', mistakes.length === 0);
  refs.mistakesList.replaceChildren();
  mistakes.forEach(item => {
    const li = document.createElement('li');
    li.textContent = `${item.es} → ${item.en}`;
    refs.mistakesList.appendChild(li);
  });
  refs.reviewBtn.textContent = reviewMode ? 'Repetir errores pendientes' : 'Repasar errores';
}

refs.nextBtn.addEventListener('click', () => {
  if (!correctAnswerLocked) return;
  currentIndex++;
  renderQuestion();
});
refs.restartBtn.addEventListener('click', startMainTest);
refs.reviewBtn.addEventListener('click', startReviewTest);
refs.newTestBtn.addEventListener('click', startMainTest);
refs.moduleFilter.addEventListener('change', updatePoolCount);
refs.typeFilter.addEventListener('change', updatePoolCount);

updatePoolCount();
startMainTest();

</script>

</body>
</html>
